<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKEMA — Assessment Trainer · Calvin MINANG</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Plateforme personnelle d'entraînement aux tests d'évaluation bancaires (cut-e / Aon / Maki), conforme au document de référence. Usage strictement personnel — Calvin MINANG.">
<style>
/* ═══════════════════════════════════════════════════════════════
   styles.css — Chrome SKEMA (réplique fidèle de la
   documentation de référence) : barre rouge,
   pages blanches, contrôles et dimensions par épreuve.
   Assessment Trainer — Calvin MINANG — usage personnel.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --red:#e0524a; --red-d:#c9423b; --red-bg:#fdeceb;
  --bg:#f5f7fa; --card:#ffffff; --card2:#ececec;
  --line:#d9dde2; --line2:#c4cad1;
  --tx:#20262b; --tx2:#5a656e; --tx3:#8a949c;
  --grn:#3f9c3f; --grn-bg:#eaf6ea;
  --amb:#b58100; --amb-bg:#fdf4e3;
  --blu:#0071bc; --blu-bg:#e8f2fa;
  --ink:#111417;
  --gray-panel:#e9e9e9; --gray-tile:#d9d9d9; --gray-box:#c9c9c9;
  --sh:0 1px 2px rgba(20,26,32,.10), 0 2px 8px rgba(20,26,32,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px; line-height:1.5;
  min-height:100vh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:14px}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--card);color:var(--tx);
  border:1px solid var(--line2);border-radius:2px;padding:6px 8px;outline:none}
input:focus,select:focus{border-color:var(--red)}
::selection{background:var(--red);color:#fff}

/* ══════════ Barre rouge SKEMA ══════════ */
.sk-top{
  position:sticky;top:0;z-index:80;background:var(--red);color:#fff;
  min-height:44px;display:flex;align-items:center;gap:14px;padding:0 18px;
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.sk-burger{font-size:19px;line-height:1;padding:4px 6px;color:#fff}
.sk-brand{font-weight:700;letter-spacing:.4px;font-size:15px}
.sk-sep{opacity:.85;font-size:14px}
.sk-title{font-size:14.5px;font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.sk-lvl{font-size:13px;opacity:.95}
.sk-count{font-size:13.5px;font-weight:600}
.sk-timer{font-size:15px;font-weight:600;letter-spacing:.5px}
.sk-timer.warn{color:#ffd9d6}
.sk-menu{
  position:absolute;top:44px;left:0;min-width:250px;background:var(--card);color:var(--tx);
  border:1px solid var(--line);box-shadow:var(--sh);padding:6px 0;display:none;z-index:90;
}
.sk-menu.on{display:block}
.sk-menu button,.sk-menu a{display:block;width:100%;text-align:left;padding:9px 16px;font-size:13px;color:var(--tx2)}
.sk-menu button:hover,.sk-menu a:hover{background:var(--bg);color:var(--red)}
.sk-menu .sep{height:1px;background:var(--line);margin:5px 0}

/* ══════════ Structure de page ══════════ */
.sk-main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 20px 70px}
.sk-main.narrow{max-width:960px}
.sk-foot{
  border-top:1px solid var(--line);background:var(--card);color:var(--tx3);
  font-size:11px;padding:10px 18px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;
}
.sk-foot strong{color:var(--tx2)}

/* ══════════ Accueil — tâches à accomplir ══════════ */
.taskhead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.taskhead h1{font-size:16px;font-weight:700}
.progwrap{min-width:280px;flex:1;max-width:520px}
.plabel{font-size:11px;color:var(--tx2);margin-bottom:5px}
.progbar{display:flex;gap:4px}
.progbar i{flex:1;height:13px;border:1px solid var(--line2);border-radius:8px;background:var(--card)}
.progbar i.f{background:var(--red);border-color:var(--red)}
.tasktable{display:flex;flex-direction:column;gap:10px}
.trow{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line2);
  border-radius:2px;box-shadow:var(--sh);padding:11px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.trow.st-done{border-left-color:var(--grn)}
.trow.st-prog{border-left-color:var(--amb)}
.trow.st-lock{border-left-color:var(--tx3);opacity:.75}
.tico{width:20px;height:20px;color:var(--tx3);flex-shrink:0}
.tico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.trow.st-done .tico{color:var(--grn)} .trow.st-prog .tico{color:var(--amb)}
.tname{flex:1;min-width:220px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.tchev{color:var(--red);font-size:13px;padding:2px 6px;cursor:pointer}
.tchev:empty{visibility:hidden}
.tdur{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:12.5px;white-space:nowrap}
.tdur svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7}
.tlang{font-size:12px;padding:5px 6px;max-width:150px}
.tstart{
  background:var(--red);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.4px;
  padding:8px 18px;border-radius:2px;display:inline-flex;align-items:center;gap:7px;
}
.tstart:hover{background:var(--red-d)}
.tdetails{display:none;width:100%;padding:10px 4px 2px 32px;font-size:12.5px;color:var(--tx2)}
.trow.open .tdetails{display:block}
.tdetails .hint{margin-top:6px}
.tdetails .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:2px;
  font-size:10.5px;font-weight:600;background:var(--bg);border:1px solid var(--line);color:var(--tx2)}
.tag.grn{background:var(--grn-bg);border-color:#bfe0cb;color:#2c6e2c}
.tag.amb{background:var(--amb-bg);border-color:#ecd9ac;color:var(--amb)}
.tag.blu{background:var(--blu-bg);border-color:#bcd9ee;color:var(--blu)}
.legend{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin-top:26px;color:var(--tx3);font-size:11px}
.legend .li{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px;text-align:center}
.legend svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ══════════ Pages d'introduction / consignes ══════════ */
.intro-page{background:var(--bg);max-width:1000px;margin:0 auto;padding:26px 30px;font-size:14.5px;color:var(--tx)}
.intro-page p{margin-bottom:16px}
.intro-page ul{margin:0 0 16px 22px}
.intro-page li{margin-bottom:7px}
.intro-page .k{font-weight:600}
.intro-nav{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:26px}
.intro-nav.center{justify-content:center}
.btn-intro{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);padding:9px 16px;
  font-size:13.5px;border-radius:2px;display:inline-flex;align-items:center;gap:8px;color:var(--tx)}
.btn-next{background:var(--red);color:#fff;padding:9px 20px;font-size:13.5px;font-weight:600;border-radius:2px;
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sh)}
.btn-next:hover{background:var(--red-d)}
.btn-next:disabled{opacity:.5;cursor:not-allowed}

/* ══════════ Zone de question générique ══════════ */
.qwrap{max-width:1000px;margin:0 auto}
.qtitle{font-size:19px;font-weight:600;text-align:center;margin:14px 0 20px;color:var(--tx)}
.qsub{font-size:13.5px;text-align:center;color:var(--tx2);margin:-12px 0 18px}
.qinstr{font-size:13.5px;font-weight:600;margin:6px 0 16px;color:var(--tx)}
.panel-gray{background:var(--gray-panel);border-radius:3px;padding:22px}
.card-w{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh)}

/* options pleine largeur (langues, mécanique) */
.optrows{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.optrow{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  padding:15px 18px;font-size:14.5px;text-align:left;width:100%;transition:.12s}
.optrow:hover{border-color:var(--line2);background:#fbfcfd}
.optrow.sel{border-color:var(--blu);box-shadow:0 0 0 2px var(--blu-bg)}
.optrow.ok{border-color:var(--grn);background:var(--grn-bg)}
.optrow.ko{border-color:var(--red);background:var(--red-bg)}
.stmtcard{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  padding:18px 22px;font-size:15px;margin:14px 0}

/* ══════════ Numérique / Verbal : onglets + true-false ══════════ */
.nv-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.nv-tab{padding:8px 13px;font-size:12.5px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-bottom:none;border-radius:2px 2px 0 0}
.nv-tab.on{color:var(--red);font-weight:700;box-shadow:inset 0 -2px 0 var(--red)}
.nv-cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,1fr);gap:22px;align-items:start}
.nv-fig{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);padding:16px;min-height:280px;overflow:auto}
.nv-side{display:flex;flex-direction:column;gap:10px}
.nv-stmt{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);padding:14px 16px;font-size:13.5px}
.nvtext{font-size:12.8px;line-height:1.65;color:var(--tx)}
.nvtext b{display:block;margin-bottom:6px}
.nvtext p{margin-bottom:9px}
.tfbtns{display:flex;flex-direction:column;gap:8px}
.tfbtn{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  padding:8px 12px;font-size:12.5px;text-align:left}
.tfbtn:hover{border-color:var(--line2)}
.tfbtn.sel{border-color:var(--blu);box-shadow:0 0 0 2px var(--blu-bg)}
.tfbtn.ok{border-color:var(--grn);background:var(--grn-bg)}
.tfbtn.ko{border-color:var(--red);background:var(--red-bg)}
.nvtbl{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.nvtbl th,.nvtbl td{border:1px solid var(--line);padding:4px 7px;text-align:right}
.nvtbl th.k,.nvtbl td.k{text-align:left;background:#fafbfc}
.nvtbl thead th{background:#f2f4f6;font-weight:600}
.nvtbl tr.s td{font-weight:700}
.nvnote{font-size:10.5px;color:var(--tx3);margin-top:6px}
.nvsvg{display:block;margin:6px auto;max-width:100%}

/* ══════════ Panneau de navigation ‹  › ══════════ */
.navpad{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:22px}
.navpad button{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  width:34px;height:30px;font-size:15px;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.navpad button:hover{color:var(--red)}
.navgrid{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.12);
  padding:14px 18px;z-index:70;display:none;flex-wrap:wrap;gap:6px;justify-content:center}
.navgrid.on{display:flex}
.navgrid button{min-width:34px;height:30px;border:1px solid var(--line);border-radius:2px;font-size:11.5px;background:var(--bg);color:var(--tx2)}
.navgrid button.done{background:var(--grn-bg);border-color:#bfe0cb;color:#2c6e2c}
.navgrid button.cur{border-color:var(--red);color:var(--red);font-weight:700}

/* ══════════ Déductif : grille 4×4 clairsemée ══════════ */
.ded-wrap{max-width:560px;margin:0 auto;text-align:center}
.ded-grid{display:grid;grid-template-columns:repeat(4,82px);gap:9px;justify-content:center;margin:18px 0 6px}
.ded-tile{width:82px;height:82px;background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--tx)}
.ded-tile.empty{box-shadow:none;border-color:#e3e6ea}
.ded-tile svg{width:52px;height:52px}
.ded-tile.hole{color:var(--tx)}
.ded-sep{height:1px;background:var(--line2);margin:16px auto;max-width:420px}
.ded-opts{display:grid;grid-template-columns:repeat(4,82px);gap:9px;justify-content:center}
.ded-opt{width:82px;height:82px;background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;transition:.1s}
.ded-opt svg{width:52px;height:52px}
.ded-opt:hover{border-color:var(--line2)}
.ded-opt.ok{border-color:var(--grn);background:var(--grn-bg)}
.ded-opt.ko{border-color:var(--red);background:var(--red-bg)}

/* ══════════ Inductif : 2 exemples / 4 candidates ══════════ */
.ind-wrap{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(320px,1.2fr);gap:18px;align-items:stretch}
.ind-side{background:var(--gray-panel);border-radius:3px;padding:18px 16px 22px}
.ind-t{font-size:17px;font-weight:600;text-align:center;margin-bottom:18px;color:var(--tx)}
.ind-ex{display:flex;flex-direction:column;gap:26px;align-items:center}
.ind-cands{display:grid;grid-template-columns:1fr 1fr;gap:26px 20px;justify-items:center}
.g3{display:grid;grid-template-columns:repeat(3,44px);gap:0;background:var(--card);border:1px solid var(--line2)}
.g3 .c{width:44px;height:44px;border:1px solid #e6e9ec;display:flex;align-items:center;justify-content:center;background:var(--card)}
.g3 .c svg{width:30px;height:30px}
.cand{cursor:pointer;padding:6px;border:2px solid transparent;border-radius:3px}
.cand.sel{border-color:var(--blu);background:#fff}
.ind-go{display:flex;justify-content:center;margin-top:20px}
.ind-go button{background:var(--card);border:1px solid var(--line2);border-radius:3px;box-shadow:var(--sh);width:52px;height:40px;font-size:17px}

/* ══════════ Concentration : E + points ══════════ */
.conc-q{font-size:15px;font-weight:600;text-align:center;margin:16px 0 18px}
.conc-box{background:var(--gray-box);border-radius:2px;max-width:640px;margin:0 auto;padding:26px;display:flex;justify-content:center}
.conc-box svg{width:300px;height:230px}
.conc-btns{display:flex;justify-content:center;gap:10px;margin-top:20px}
.conc-btn{background:var(--red);color:#fff;font-size:13px;padding:8px 18px;border-radius:2px;box-shadow:var(--sh)}
.conc-btn:hover{background:var(--red-d)}
.conc-btn:active{background:#cfcfcf;color:var(--tx)}

/* ══════════ Questionnaires : blocs de 3 affirmations ══════════ */
.blk-head{text-align:center;margin:10px 0 22px}
.blk-head h2{font-size:21px;font-weight:700}
.blk-head p{font-size:14px;color:var(--tx2);margin-top:6px}
.blk{display:flex;flex-direction:column;gap:14px;max-width:860px;margin:0 auto}
.blk-row{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);overflow:hidden}
.blk-t{padding:34px 20px 12px;font-size:15px}
.blk-d{background:#c9c9c9;display:flex;justify-content:space-around;padding:11px 12px}
.dot{width:34px;height:34px;border-radius:50%;background:#dcdcdc;box-shadow:inset 0 -2px 3px rgba(0,0,0,.10);cursor:pointer;transition:.1s}
.dot:hover{background:#e7e7e7}
.dot.on{background:var(--red);box-shadow:0 0 0 3px rgba(224,82,74,.25)}
.blk-foot{position:fixed;left:0;right:0;bottom:0;background:transparent;display:flex;justify-content:center;align-items:center;padding:10px 0 14px;pointer-events:none}
.blk-next{pointer-events:auto;font-size:26px;color:var(--tx);padding:4px 26px}
.blk-rest{pointer-events:auto;position:fixed;right:26px;bottom:16px;background:var(--red);color:#fff;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:var(--sh)}

/* ══════════ Learning Efficiency : séquence d'objets ══════════ */
.le-seq{display:flex;justify-content:center;align-items:center;min-height:190px}
.le-obj{width:120px;height:120px;background:var(--gray-box);border-radius:2px;display:flex;align-items:center;justify-content:center}
.le-obj svg{width:86px;height:86px}
.le-fields{display:grid;grid-template-columns:repeat(6,74px);gap:8px;justify-content:center;margin:14px 0}
.le-f{width:74px;height:64px;background:var(--gray-tile);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.le-f svg{width:44px;height:44px}
.le-f.filled{background:#cfcfcf}
.le-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.le-p{width:74px;height:64px;background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.le-p svg{width:44px;height:44px}
.le-p:hover{border-color:var(--line2)}
.le-break{text-align:center;font-size:15px;color:var(--tx2);padding:60px 0}

/* ══════════ Information Handling : boîte de réception ══════════ */
.inbox-wrap{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(320px,1.1fr);gap:16px;align-items:start}
.inbox-list{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);max-height:560px;overflow:auto}
.inbox-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.mail{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.mail:hover{background:var(--bg)}
.mail.on{background:var(--blu-bg);box-shadow:inset 3px 0 0 var(--blu)}
.mail .m1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.mail .m2{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail .m3{color:var(--tx3);font-size:11px;display:flex;gap:8px;align-items:center}
.mail .prio{font-weight:700}
.mail .prio.H{color:var(--red)} .mail .prio.M{color:var(--amb)} .mail .prio.L{color:var(--tx3)}
.mail.new{animation:flash 1.2s}
@keyframes flash{0%{background:var(--amb-bg)}100%{background:transparent}}
.mailview{background:var(--card);border:1px solid var(--line);border-radius:2px;box-shadow:var(--sh);padding:14px 16px;font-size:13px}
.mailview .row{display:flex;gap:8px;margin-bottom:5px}
.mailview .row .k{width:64px;color:var(--tx3);flex-shrink:0}
.mailview .body{margin:12px 0;white-space:pre-wrap;color:var(--tx2);font-size:12.8px}
.mail-ctl{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mail-ctl label{font-size:11.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.mail-ctl select{width:100%}
.guide-fab{position:fixed;right:22px;bottom:20px;width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.25);z-index:60}
.guide-panel{position:fixed;inset:0;background:rgba(20,26,32,.35);z-index:95;display:none;align-items:center;justify-content:center;padding:20px}
.guide-panel.on{display:flex}
.guide-box{background:var(--card);border-radius:3px;box-shadow:var(--sh);max-width:760px;width:100%;max-height:82vh;overflow:auto;padding:22px 26px;font-size:13px}
.guide-box h3{font-size:15px;margin-bottom:10px}
.guide-box ul{margin:0 0 12px 20px}
.guide-box li{margin-bottom:5px}

/* ══════════ Switch Challenge : machine ══════════ */
.sw-wrap{max-width:760px;margin:0 auto;text-align:center}
.sw-note{font-size:14.5px;margin:10px 0 18px}
.sw-row{display:flex;justify-content:center;gap:26px;margin:10px 0}

      if (k === 'class') n.className = attrs[k];
      else if (k === 'dataset') Object.assign(n.dataset, attrs[k]);
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (html != null) n.innerHTML = html;
    return n;
  }
  const frag = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; };

  /* ─────────── Toasts ─────────── */
  function toast(msg, type, ttl = 3200) {
    const wrap = $('#toastWrap'); if (!wrap) return;
    const n = el('div', { class: 'toast ' + (type || '') }, msg);
    wrap.appendChild(n);
    setTimeout(() => { n.style.opacity = '0'; n.style.transform = 'translateX(30px)'; setTimeout(() => n.remove(), 220); }, ttl);
  }

  /* ─────────── Modale ─────────── */
  function modal(html) {
    const back = $('#modalBack'), box = $('#modalBox');
    box.innerHTML = html; back.hidden = false; back.style.display = 'flex';
    back.onclick = (e) => { if (e.target === back) closeModal(); };
    document.addEventListener('keydown', escClose);
  }
  function escClose(e) { if (e.key === 'Escape') closeModal(); }
  function closeModal() {
    const b = $('#modalBack');
    if (b) { b.hidden = true; b.style.display = 'none'; }
    document.removeEventListener('keydown', escClose);
  }

  /* ─────────── Sons (bips WebAudio, sans fichier externe) ─────────── */
  let actx = null;
  function beep(kind = 'ok') {
    if (!store.get('settings', {}).sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const f = { ok: 660, ko: 190, tick: 420, end: 520 }[kind] || 500;
      o.type = kind === 'ko' ? 'sawtooth' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (kind === 'tick' ? 0.07 : 0.18));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.2);
    } catch (e) {}
  }

  /* ═══════════════════════════════════════════════════════════
     FIGURES SVG — moteur unique.
     Les figures sont décrites par un "kind" + couleur + options,
     ce qui garantit des formes IDENTIQUES d'un tirage à l'autre
     (aucune déformation possible : géométrie paramétrique fixe).
     ═══════════════════════════════════════════════════════════ */
  const C = {
    ink: '#23282c', grn: '#0a8a3c', amb: '#b58100', red: '#c62828',
    blu: '#1565c0', pur: '#5b3d8f', gray: '#5a656e', teal: '#0d6f78', pink: '#b5317a'
  };
  const PALETTE = [C.grn, C.amb, C.red, C.blu, C.pur, C.teal, C.pink, C.ink];

  function svg(inner, vb = 100) {
    return '<svg viewBox="0 0 ' + vb + ' ' + vb + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  /** Forme élémentaire. kind ∈ liste ci-dessous. color = couleur. opts spécifiques. */
  function shape(kind, color, o = {}) {
    const c = color || C.ink, sw = o.sw || 7;
    const S = { 'stroke': c, 'stroke-width': sw, 'fill': 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    const A = (d) => '<path d="' + d + '" ' + attrs(S) + '/>';
    switch (kind) {
      /* lignes directionnelles (concentration / cut-e) */
      case 'line-up': return svg(A('M10 82 L30 50 L50 66 L72 26 L90 38'));
      case 'line-down': return svg(A('M10 20 L30 52 L50 36 L72 76 L90 64'));
      case 'line-updown': return svg(A('M10 72 L32 30 L52 62 L74 24 L90 48'));
      case 'line-downup': return svg(A('M10 28 L32 70 L52 38 L74 76 L90 52'));
      case 'line-wave': return svg(A('M8 52 Q26 18 44 52 T80 52 T108 52'));
      case 'line-flat': return svg(A('M10 52 L30 44 L50 58 L70 46 L90 55'));
      case 'line-step': return svg(A('M10 78 L32 78 L32 52 L54 52 L54 28 L80 28 L80 14'));
      /* flèches */
      case 'arr-up': return svg('<path d="M50 88 L50 20 M28 42 L50 18 L72 42" ' + attrs(S) + '/>');
      case 'arr-down': return svg('<path d="M50 12 L50 80 M28 58 L50 82 L72 58" ' + attrs(S) + '/>');
      case 'arr-right': return svg('<path d="M12 50 L80 50 M58 28 L82 50 L58 72" ' + attrs(S) + '/>');
      case 'arr-left': return svg('<path d="M88 50 L20 50 M42 28 L18 50 L42 72" ' + attrs(S) + '/>');
      case 'chev-up': return svg(A('M22 66 L50 32 L78 66'));
      case 'chev-down': return svg(A('M22 34 L50 68 L78 34'));
      /* points */
      case 'dot-1': return svg('<circle cx="50" cy="50" r="18" fill="' + c + '"/>');
      case 'dot-2': return svg('<circle cx="30" cy="50" r="15" fill="' + c + '"/><circle cx="70" cy="50" r="15" fill="' + c + '"/>');
      case 'dot-3': return svg('<circle cx="50" cy="26" r="13" fill="' + c + '"/><circle cx="28" cy="68" r="13" fill="' + c + '"/><circle cx="72" cy="68" r="13" fill="' + c + '"/>');
      case 'dot-ring': return svg('<circle cx="50" cy="50" r="30" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><circle cx="50" cy="50" r="9" fill="' + c + '"/>');
      case 'dot-sq': return svg('<circle cx="50" cy="50" r="32" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><rect x="36" y="36" width="28" height="28" fill="' + c + '"/>');
      /* cercles / disques */
      case 'circle': return svg('<circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'disc': return svg('<circle cx="50" cy="50" r="34" fill="' + c + '"/>');
      case 'half-top': return svg('<path d="M16 50 A34 34 0 0 1 84 50 Z" fill="' + c + '"/><circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'half-left': return svg('<path d="M50 84 A34 34 0 0 1 50 16 Z" fill="' + c + '"/><circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'quarter': return svg('<path d="M16 50 A34 34 0 0 1 50 16 L50 50 Z" fill="' + c + '"/>');
      /* carrés */
      case 'square': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'square-full': return svg('<rect x="18" y="18" width="64" height="64" fill="' + c + '"/>');
      case 'square-rot': return svg('<rect x="50" y="10" width="56" height="56" transform="rotate(45 50 50)" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'square-half': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><rect x="18" y="50" width="64" height="32" fill="' + c + '"/>');
      case 'square-diag': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><path d="M18 82 L82 18" ' + attrs({ stroke: c, 'stroke-width': sw }) + '/>');
      /* triangles */
      case 'tri-up': return svg('<path d="M50 16 L86 84 L14 84 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-down': return svg('<path d="M50 84 L86 16 L14 16 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-left': return svg('<path d="M16 50 L84 86 L84 14 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-right': return svg('<path d="M84 50 L16 86 L16 14 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-full': return svg('<path d="M50 16 L86 84 L14 84 Z" fill="' + c + '"/>');
      /* croix / plus / étoile */
      case 'cross': return svg(A('M22 22 L78 78 M78 22 L22 78'));
      case 'plus': return svg(A('M50 18 L50 82 M18 50 L82 50'));
      case 'star': return svg('<path d="M50 12 L60 40 L90 40 L66 58 L75 88 L50 70 L25 88 L34 58 L10 40 L40 40 Z" ' + attrs({ stroke: c, 'stroke-width': 5, fill: 'none' }) + '/>');
      /* divers */
      case 'moon': return svg('<path d="M62 14 A38 38 0 1 0 62 86 A30 30 0 1 1 62 14 Z" fill="' + c + '"/>');
      case 'diamond': return svg('<path d="M50 14 L86 50 L50 86 L14 50 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'lshape': return svg(A('M22 20 L22 80 L80 80'));
      case 'zshape': return svg(A('M22 24 L80 24 L22 78 L80 78'));
      /* horloge (test mécanique) */
      case 'clock': {
        const h = ((o.hour || 3) % 12) * 30, m = (o.min || 0) * 6;
        return svg(
          '<circle cx="50" cy="50" r="38" ' + attrs({ stroke: c, 'stroke-width': 5, fill: 'none' }) + '/>' +
          '<line x1="50" y1="50" x2="' + (50 + 20 * Math.sin(h * Math.PI / 180)) + '" y2="' + (50 - 20 * Math.cos(h * Math.PI / 180)) + '" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/>' +
          '<line x1="50" y1="50" x2="' + (50 + 30 * Math.sin(m * Math.PI / 180)) + '" y2="' + (50 - 30 * Math.cos(m * Math.PI / 180)) + '" stroke="' + c + '" stroke-width="4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="50" r="3.5" fill="' + c + '"/>'
        );
      }
      case 'gear': {
        let t = '';
        for (let i = 0; i < 8; i++) {
          const a = i * 45 * Math.PI / 180;
          t += '<rect x="' + (50 + 28 * Math.cos(a) - 5) + '" y="' + (50 + 28 * Math.sin(a) - 5) + '" width="10" height="10" fill="' + c + '"/>';
        }
        return svg('<circle cx="50" cy="50" r="28" ' + attrs({ stroke: c, 'stroke-width': 8, fill: 'none' }) + '/>' + t);
      }
      /* flèche courbe (sens de rotation) */
      case 'rot-cw': return svg('<path d="M22 50 A28 28 0 1 1 50 78" ' + attrs(S) + '/><path d="M50 78 L36 70 M50 78 L38 90" ' + attrs(S) + '/>');
      case 'rot-ccw': return svg('<path d="M78 50 A28 28 0 1 1 50 22" ' + attrs(S) + '/><path d="M50 22 L64 30 M50 22 L62 10" ' + attrs(S) + '/>');
      default: return svg('<rect x="22" y="22" width="56" height="56" rx="8" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
    }
  }
  function attrs(o) { return Object.keys(o).map(k => k + '="' + o[k] + '"').join(' '); }

  /** Chiffre 1-9 en SVG, tracé au centre (Switch Challenge). */
  function digitSVG(d, color) {
    const c = color || C.ink;
    return svg('<text x="50" y="72" font-family="JetBrains Mono, monospace" font-size="72" font-weight="700" fill="' + c + '" text-anchor="middle">' + d + '</text>');
  }

  /** Tuile = case de grille pouvant contenir : rien, une forme, un chiffre, une lettre. */
  function tile(spec, size) {
    if (spec == null) return '<div class="mat"></div>';
    const cls = 'mat' + (spec.single ? ' single' : '');
    let inner = '';
    if (spec.type === 'digit') inner = digitSVG(spec.v, spec.color);
    else if (spec.type === 'letter') inner = svg('<text x="50" y="74" font-family="Inter" font-size="66" font-weight="800" fill="' + (spec.color || C.ink) + '" text-anchor="middle">' + esc(spec.v) + '</text>');
    else if (spec.type === 'shape') inner = shape(spec.kind, spec.color, spec.opts);
    else if (spec.type === 'empty') inner = '';
    else if (Array.isArray(spec.cells)) {
      /* matrice 2x2 explicite */
      inner = '<div class="mat">' + spec.cells.map(cs => '<i>' + (cs ? (cs.type === 'shape' ? shape(cs.kind, cs.color) : (cs.type === 'digit' ? digitSVG(cs.v, cs.color) : '')) : '') + '</i>').join('') + '</div>';
    }
    return '<div class="' + cls + '">' + inner + '</div>';
  }

  return { rng, int, pick, shuffle, sample, hash, pct, ms, num, esc, fr, dayKey, daysBetween,
           store, $, $$, el, frag, toast, modal, closeModal, beep,
           shape, svg, digitSVG, tile, C, PALETTE };
})();

  /* ─────────── Textes d'introduction (FR / EN), conformes aux captures ─────────── */
  const I = (fr, en) => ({ fr, en });
  const INTRO = {
    behaviour: [
      I('<p>Ce questionnaire décrit votre comportement quotidien au travail et dans des situations similaires. Ce n’est pas un test : il n’y a donc pas de bonnes ou de mauvaises réponses.</p><p>Vous trouverez des blocs de trois affirmations. Pour chaque bloc, six points sont à répartir entre les trois affirmations.</p><p>Plus une affirmation décrit votre comportement, plus vous devez lui attribuer de points. Vous pouvez répartir les six points de toutes les façons possibles ; vous n’êtes pas obligé de distribuer les six points.</p><p>Répartissez les six points de la façon qui décrit le mieux votre comportement quotidien.</p><p>Les pages suivantes expliquent le fonctionnement du questionnaire, avec un exemple avant de commencer.</p>',
        '<p>This questionnaire has been developed to describe your everyday behaviour in the workplace and similar situations. It is not a test, so there are no right or wrong answers as such.</p><p>In this questionnaire you will find blocks of three statements. For each block there are six points to allocate to the three statements.</p><p>The better a statement describes your everyday behaviour, the more points you should allocate to this statement. You can distribute the six points amongst the three statements in every possible way. You do not have to distribute all six points.</p><p>Please make sure that you distribute the six points in a way that best describes your everyday behaviour.</p><p>On the next pages the structure of the questionnaire is explained and you can acquaint yourself with an example before starting the questionnaire itself.</p>'),
      I('<p>Veuillez noter :</p><ul><li>Soyez aussi ouvert et honnête que possible. N’attribuez pas des points parce que cela paraîtrait idéal.</li><li>Il peut être difficile de répartir les points ; choisissez alors la répartition qui vous correspond le mieux, en vous souvenant que vous n’êtes pas obligé de placer les six points.</li><li>Sans limite de temps, travaillez néanmoins aussi vite et précisément que possible : 15 minutes en moyenne. Le questionnaire ne peut pas être interrompu : fermer la fenêtre fait perdre toutes les réponses.</li><li>Il n’est pas possible de revenir en arrière ni de modifier une réponse précédente.</li></ul>',
        '<p>When completing the questionnaire, please note:</p><ul><li>Be as open and honest as you can. Do not just allocate points to the statements because you feel this would be the most appropriate or ideal way to be.</li><li>Occasionally you may find it difficult to allocate the points; please then choose the distribution of points that matches you best, remembering you do not have to allocate all six points.</li><li>Although there is no time limit, you should work as quickly and accurately as you can. Completing the questionnaire on average takes no longer than 15 minutes. You cannot interrupt it: should you close the window all answers will be lost.</li><li>It is not possible to move back while completing the questionnaire; once you moved on, you cannot change your previous answers.</li></ul>')
    ],
    motivation: [
      I('<p>Ce questionnaire décrit vos préférences et vos attitudes concernant votre vie professionnelle. Ce n’est pas un test : il n’y a pas de bonnes ou de mauvaises réponses.</p><p>Vous trouverez des blocs de trois affirmations. Pour chaque bloc, six points sont à répartir entre les trois affirmations.</p><p>Pensez à l’environnement de travail idéal pour vous. Plus une affirmation correspond à cette idée, plus vous devez lui attribuer de points. Vous pouvez répartir les six points de toutes les façons ; vous n’êtes pas obligé de tout distribuer.</p><p>Les pages suivantes expliquent le fonctionnement, avec un exemple avant de commencer.</p>',
        '<p>This questionnaire has been developed to describe your preferences and attitudes regarding your working life. It is not a test, so there are no right or wrong answers as such.</p><p>In this questionnaire you will find blocks of three statements. For each block there are six points to allocate to the three statements.</p><p>Think of how the working environment in a company should be in order to make you feel good. The better a statement matches your idea of an ideal situation, the more points you should allocate to this statement. You can distribute the six points amongst the three statements in every possible way. You do not have to distribute all six points.</p><p>On the next pages the handling of the questionnaire is explained and you can acquaint yourself with an example before starting the questionnaire itself.</p>'),
      I('<p>Veuillez noter :</p><ul><li>Soyez aussi ouvert et honnête que possible.</li><li>Choisissez la répartition qui vous correspond le mieux ; vous n’êtes pas obligé de placer les six points.</li><li>Sans limite de temps, répondez néanmoins vite : 15 minutes en moyenne. Le questionnaire ne peut pas être interrompu.</li><li>Aucun retour en arrière : une réponse validée ne peut plus être modifiée.</li></ul>',
        '<p>When completing the questionnaire, please note:</p><ul><li>Be as open and honest as you can.</li><li>Choose the distribution that matches you best; you do not have to allocate all six points.</li><li>Although there is no time limit, work quickly: completing it takes no longer than 15 minutes on average. It cannot be interrupted.</li><li>It is not possible to move back; once you moved on, you cannot change your previous answers.</li></ul>')
    ],
    numerical: [
      I('<p>Ce test mesure votre capacité à analyser et évaluer des données issues de tableaux et de diagrammes.</p><p>Des affirmations vous sont présentées, à évaluer individuellement : chaque affirmation est-elle vraie sur la seule base du dossier (les différentes feuilles de données) ? Lisez d’abord l’affirmation, puis ouvrez la feuille de données nécessaire.</p><p>Répondez TRUE si l’affirmation est absolument vraie au vu du dossier, FALSE si elle est absolument fausse, CANNOT SAY si vous ne pouvez pas trancher sans information supplémentaire.</p><p>Les pages suivantes expliquent le test, puis trois exemples non chronométrés et non notés vous familiarisent avec la tâche.</p><p>Assurez-vous d’avoir une calculatrice, un crayon et du papier.</p>',
        '<p>This test checks your ability to analyse and evaluate data from tables and diagrams.</p><p>You will be presented with statements that need to be evaluated individually: is each statement true based only on the information contained in the brief (the different data sheets)? First read the statement, then select and look at the data sheet you need.</p><p>Select TRUE if the statement is absolutely true given the brief, FALSE if it is absolutely untrue, CANNOT SAY if you cannot say beyond doubt, without further information, whether it is true or false.</p><p>On the following pages the structure and instructions of the test will be explained. Afterwards three examples, not timed and not scored, let you get to know the task.</p><p>Please make sure that you have a calculator, a pencil and notepaper.</p>'),
      I('<p>Vous avez terminé les exemples. Veuillez noter :</p><ul><li>Le test contient 37 tâches. Vous disposez de 12 minutes. La plupart des gens ne terminent pas les 37 tâches en 12 minutes.</li><li>Le test ne peut pas être interrompu une fois commencé.</li><li>Le test exige rapidité et précision.</li><li>Les informations des feuilles de données ne changent pas pendant le test.</li><li>Chaque affirmation se rapporte à une seule feuille de données : à vous de la retrouver. Sauf mention contraire, les chiffres concernent Halden &amp; Roe.</li><li>Une seule réponse correcte par tâche ; vous pouvez changer de réponse en la surlignant.</li><li>Le test se termine automatiquement après 12 minutes ; vous pouvez l’arrêter plus tôt si tout est répondu.</li><li>Le chronomètre démarre automatiquement à l’apparition de la première tâche.</li></ul>',
        '<p>You have now completed the examples. Please note:</p><ul><li>The test contains 37 tasks. You will be given 12 minutes to complete these 37 tasks. Most people cannot complete all 37 tasks in 12 minutes.</li><li>The test cannot be interrupted once you have started.</li><li>The test requires you to work quickly and accurately.</li><li>The information on the data sheets will not change during the test.</li><li>Each statement relates to a singular data sheet; you need to find and refer to the respective data sheet. If not otherwise stated, all figures relate to Halden &amp; Roe.</li><li>There is only one correct answer to each task. You may change your answer by highlighting it.</li><li>The test will automatically end after 12 minutes. You can stop earlier if you have answered all the questions.</li><li>The timer will start automatically when the first task appears on the screen.</li></ul>')
    ],
    verbal: [
      I('<p>Ce test mesure votre capacité à analyser et évaluer des informations écrites.</p><p>Des affirmations vous sont présentées, à évaluer individuellement sur la seule base du dossier (les différentes feuilles de textes). Lisez d’abord l’affirmation, puis ouvrez la feuille nécessaire.</p><p>Répondez TRUE si l’affirmation est absolument vraie au vu du dossier, FALSE si elle est absolument fausse, CANNOT SAY si le texte ne permet pas de trancher.</p><p>Les pages suivantes expliquent le test, puis trois exemples non chronométrés et non notés vous familiarisent avec la tâche.</p>',
        '<p>This test checks your ability to analyse and evaluate data from written information.</p><p>You will be presented with statements that need to be evaluated individually based only on the information contained in the brief (the different data sheets). First read the statement, then select and look at the data sheet you need.</p><p>Select TRUE if the statement is absolutely true given the brief, FALSE if it is absolutely untrue, CANNOT SAY if you cannot say beyond doubt, without further information, whether it is true or false.</p><p>On the following pages the structure and instructions of the test will be explained. Afterwards three examples, not timed and not scored, let you get to know the task.</p>'),
      I('<p>Vous avez terminé les exemples. Veuillez noter :</p><ul><li>Le test contient 49 tâches. Vous disposez de 12 minutes. La plupart des gens ne terminent pas les 49 tâches en 12 minutes.</li><li>Le test ne peut pas être interrompu une fois commencé.</li><li>Le test exige rapidité et précision.</li><li>Les informations des feuilles de données ne changent pas pendant le test.</li><li>Chaque affirmation se rapporte à une seule feuille : à vous de la retrouver.</li><li>Une seule réponse correcte par tâche ; vous pouvez changer de réponse en la surlignant.</li><li>Le test se termine automatiquement après 12 minutes ; vous pouvez l’arrêter plus tôt si tout est répondu.</li><li>Le chronomètre démarre automatiquement à l’apparition de la première tâche.</li></ul>',
        '<p>You have now completed the examples. Please note:</p><ul><li>The test contains 49 tasks. You will be given 12 minutes to complete these 49 tasks. Most people cannot complete all 49 tasks in 12 minutes.</li><li>The test cannot be interrupted once you have started.</li><li>The test requires you to work quickly and accurately.</li><li>The information on the data sheets will not change during the test.</li><li>Each statement relates to a singular data sheet; you need to find and refer to the respective data sheet.</li><li>There is only one correct answer to each task. You may change your answer by highlighting it.</li><li>The test will automatically end after 12 minutes. You can stop earlier if you have answered all the questions.</li><li>The timer will start automatically when the first task appears on the screen.</li></ul>')
    ],
    deductive: [
      I('<p>Ce test mesure votre raisonnement déductif. Le test dure 6 minutes.</p><p>Le test repose sur une grille contenant plusieurs objets. Une case de la grille est marquée d’un point d’interrogation. Chaque objet n’apparaît qu’une seule fois par ligne et par colonne. Votre tâche : trouver quel objet doit se trouver dans la case marquée du point d’interrogation.</p><p>Les pages suivantes expliquent le test, puis un exemple non chronométré et non noté vous familiarise avec la tâche.</p>',
        '<p>This test measures your deductive reasoning ability. The test takes 6 minutes.</p><p>The test is based on a grid containing several objects. One cell in the grid is marked by a question mark. Each object appears only once per row and per column. Your task is to figure out what object should be in the cell marked with a question mark.</p><p>The following pages explain the structure and handling of the test. Afterwards you will have the opportunity to familiarise yourself with the task by doing an example. This example is not timed and it is not scored.</p>'),
      I('<p>Vous avez terminé l’exemple. Veuillez noter :</p><ul><li>Le test dure 6 minutes. Pendant ce temps, complétez autant de questions que possible.</li><li>Une seule réponse correcte par question ; seule la réponse donnée compte, il n’est pas nécessaire de compléter toute la grille.</li><li>Le vert indique que votre réponse était correcte, le rouge qu’elle était fausse.</li><li>Sélectionner une réponse vous emmène automatiquement à la question suivante.</li><li>Le temps commence à compter automatiquement à l’apparition de la première question.</li><li>Plus vite vous répondez, plus vous complétez de questions dans les 6 minutes.</li><li>Votre objectif : compléter autant de questions que possible, aussi vite que possible.</li></ul>',
        '<p>You have completed the example and should now have understood how this test works. Please note:</p><ul><li>The test will take 6 minutes. During this time you can complete as many questions as you are able to.</li><li>There is only one correct answer for every question. It is only the answer you give that will impact your result; it is not necessary to complete the whole grid.</li><li>Green indicates that your selected answer was correct and red indicates that your answer was wrong.</li><li>Selecting an answer will automatically take you to the next question.</li><li>The time will start to count automatically when the first question appears on the screen.</li><li>The faster you respond, the more questions you will be able to complete within the 6 minutes given.</li><li>Your goal is to complete as many questions as possible as quickly as possible.</li></ul>')
    ],
    inductive: [
      I('<p>Ce test mesure votre capacité à découvrir des règles et des relations dans des informations complexes. Le test dure exactement 6 minutes.</p><p>Les pages suivantes expliquent le fonctionnement du test. Des exemples non chronométrés et non notés vous permettent de vous familiariser avec la tâche : prenez le temps nécessaire.</p><p>Assurez-vous de ne pas être dérangé ou distrait pendant le test.</p>',
        '<p>This test measures your ability to discover rules and relationships in complex information. The test takes exactly 6 minutes.</p><p>The following pages explain how the test works. You will have the opportunity to familiarise yourself with the task by completing several examples. The examples are not timed and they are not scored, so please spend as much time on them as you wish.</p><p>Make absolutely sure that you will not be disturbed or distracted during the test.</p>'),
      I('<p>Vous avez terminé les exemples. Veuillez noter :</p><ul><li>Le test dure 6 minutes.</li><li>Il n’y a toujours qu’une seule réponse correcte : choisissez toujours les deux grilles qui suivent la règle.</li><li>La règle porte toujours sur le nombre et la position des objets dans les grilles. La règle n’inclut jamais de négation logique ni de « OU ».</li><li>Vous pouvez passer une question : les questions passées sont comptées comme incorrectes.</li><li>Le temps démarre automatiquement à l’apparition de la première question.</li><li>Le test se termine automatiquement après 6 minutes.</li><li>Le test ne peut pas être interrompu une fois commencé.</li></ul>',
        '<p>You have now completed the examples and should fully understand how the test works. Please note:</p><ul><li>The test lasts 6 minutes.</li><li>There is always only one correct answer for each question; that is, you must always choose only two grids that follow the rule.</li><li>The rule always relates to the number and position of objects within the grids. The rule never includes a logical NOT or OR statement.</li><li>You may skip a question if you wish. Skipped questions are counted as incorrect.</li><li>The time starts automatically when the first question appears on the screen.</li><li>The test ends automatically after 6 minutes.</li><li>The test cannot be interrupted once it has started.</li></ul>')
    ],
    concentration: [
      I('<p>Ce test mesure votre capacité de concentration. Il dure 2 minutes.</p><p>Votre tâche : marquer chaque E entouré d’exactement trois points, en pressant le bouton « CORRECT ». Tout objet qui n’est pas un E entouré d’exactement trois points doit être marqué en pressant « INCORRECT ». L’objet reste affiché jusqu’à ce que vous pressiez un bouton.</p><p>Un exemple non noté de 30 secondes vous familiarise avec la tâche.</p><p>Assurez-vous de ne pas être dérangé pendant toute la durée du test.</p>',
        '<p>This test measures your ability to concentrate. The completion will take 2 minutes.</p><p>Your task is to mark every E that is surrounded by exactly three dots by pressing the button “CORRECT”. Every object that is not an E surrounded by exactly three dots is to be marked by pressing the button “INCORRECT”. The object will be shown until you press a button.</p><p>You will have the opportunity to get familiar with the task by completing an example. The example will take 30 seconds and is not scored.</p><p>Make absolutely sure that you will not be disturbed or distracted during the entire test.</p>'),
      I('<p>Vous avez terminé l’exemple. Veuillez noter :</p><ul><li>Le test exige rapidité et précision.</li><li>Réagissez aussi vite que possible en pressant « CORRECT » ou « INCORRECT », ou les touches D / A au clavier.</li><li>Le test complet dure 2 minutes.</li><li>Vérifiez que votre souris fonctionne correctement.</li><li>Le chronométrage démarre automatiquement avec l’apparition du premier objet.</li></ul>',
        '<p>You have now completed the example and should be sure that you have understood the structure and handling of the task. Please note:</p><ul><li>The test requires fast and accurate working.</li><li>React as quickly as possible by pressing “CORRECT” or “INCORRECT”, or “D” / “A” if you use a keyboard.</li><li>The whole test will take 2 minutes to complete.</li><li>Make absolutely sure that the mouse connected to your computer is working properly.</li><li>The time measurement starts automatically with the appearance of the first object on your screen.</li></ul>')
    ],
    multitask: [
      I('<p>Ce module mesure votre capacité à maintenir deux tâches en parallèle. Il dure 8 minutes.</p><p>Un stimulus central affiche une lettre et un chiffre. Une consigne indique quelle dimension juger : juger la LETTRE (voyelle ou consonne) ou juger le CHIFFRE (pair ou impair). La consigne change par blocs : adaptez-vous immédiatement.</p><p>Répondez avec les deux boutons proposés. La rapidité et la précision comptent autant l’une que l’autre.</p><p>Les pages suivantes expliquent le fonctionnement, avec un exemple non noté.</p>',
        '<p>This module measures your ability to keep two tasks running in parallel. It takes 8 minutes.</p><p>A central stimulus shows a letter and a digit. A cue tells you which dimension to judge: judge the LETTER (vowel or consonant) or judge the DIGIT (odd or even). The cue changes between blocks: adapt immediately.</p><p>Answer with the two buttons offered. Speed and accuracy both count.</p><p>The following pages explain the handling, with an unscored example.</p>'),
      I('<p>Veuillez noter :</p><ul><li>Le test exige rapidité et précision.</li><li>La consigne active est rappelée au-dessus du stimulus.</li><li>Le test dure 8 minutes et ne peut pas être interrompu.</li><li>Le chronométrage démarre avec le premier stimulus.</li></ul>',
        '<p>Please note:</p><ul><li>The test requires fast and accurate working.</li><li>The active cue is displayed above the stimulus.</li><li>The test lasts 8 minutes and cannot be interrupted.</li><li>Time measurement starts with the first stimulus.</li></ul>')
    ],
    learning: [
      I('<p>Ce test mesure votre capacité à mémoriser des objets présentés dans un ordre donné, ainsi que votre aptitude à apprendre. Le test dure environ 5 minutes.</p><p>Les pages suivantes expliquent la structure et le maniement du test. Un exemple non noté vous familiarise ensuite avec la tâche.</p><p>Assurez-vous de ne pas être dérangé ou distrait pendant le test.</p>',
        '<p>This test measures your ability to memorise previously shown objects in the correct order. Additionally, the test measures your learning aptitude. The whole test will take approximately 5 minutes.</p><p>The following pages will explain the structure and the handling of this test. Afterwards, you will have the opportunity to familiarise yourself with the task by completing an example. Your performance on the example will not impact your test results.</p><p>Please ensure that you will not be disturbed or distracted during the test.</p>'),
      I('<p>Vous avez terminé l’exemple. Veuillez noter :</p><ul><li>Le test exige rapidité et précision.</li><li>Vous avez exactement 30 secondes par section.</li><li>Si vous placez tous les objets avant la fin des 30 secondes, vous pouvez passer à la section suivante avec « suivant ».</li><li>Avant chaque section, une pause de 6 secondes.</li><li>Le test comprend 6 sections avec exactement les mêmes 12 objets.</li><li>Le test complet dure environ 5 minutes.</li><li>Le chronométrage démarre automatiquement avec la première tâche.</li></ul>',

<script>
/* ═══════════════════════════════════════════════════════════════
   drills.js — générateurs déterministes (déductif clairsemé,
   inductif non ambigu, concentration E+points, switch codes,
   multi-tâches, learning) + banque numérique (6 feuilles, 37 énoncés).
   Assessment Trainer — Calvin MINANG — usage personnel.
   ═══════════════════════════════════════════════════════════════ */
'use strict';

const DRILL = (() => {

  const rng = U.rng, int = U.int, pick = U.pick, shuffle = U.shuffle;

  /* ══════════════════ DÉDUCTIF — grille 4×4 clairsemée ══════════════════
     Une ligne complète + la colonne du trou (sauf le trou) sont révélées :
     la case « ? » admet alors une solution unique (contrainte de colonne). */
  function dedItem(seed, i) {
    const r = rng(seed);
    const sym = shuffle(r, [0, 1, 2, 3]);
    const rows = shuffle(r, [0, 1, 2, 3]);
    const cols = shuffle(r, [0, 1, 2, 3]);
    const g = [];
    for (let y = 0; y < 4; y++) { g.push([]); for (let x = 0; x < 4; x++) g[y].push(sym[(rows[y] + cols[x]) % 4]); }
    const hr = int(r, 0, 3), hc = int(r, 0, 3);
    const fullRow = (hr + int(r, 1, 3)) % 4;                 /* ligne révélée ≠ ligne du trou */
    const shown = {};
    for (let x = 0; x < 4; x++) shown[fullRow + ',' + x] = g[fullRow][x];
    for (let y = 0; y < 4; y++) if (y !== hr && y !== fullRow) shown[y + ',' + hc] = g[y][hc];
    if (r() < 0.5) {                                        /* indice supplémentaire occasionnel */
      let y = int(r, 0, 3), x = int(r, 0, 3), guard = 0;
      while ((y === hr && x === hc) || shown[y + ',' + x] != null || y === fullRow || x === hc) { y = int(r, 0, 3); x = int(r, 0, 3); if (++guard > 20) break; }
      if (guard <= 20) shown[y + ',' + x] = g[y][x];
    }
    const ans = g[hr][hc];
    const opts = shuffle(r, [0, 1, 2, 3]);
    return { id: 'D' + i, kind: 'latin', grid: g, shown, hole: [hr, hc], options: opts, ans: opts.indexOf(ans) };
  }

  /* ══════════════════ INDUCTIF — 2 exemples / 4 candidates ══════════════════ */
  const IRULES = [
    { id: 'corners', ok: g => g[0] === g[2] && g[0] === g[6] && g[0] === g[8] },
    { id: 'row',     ok: g => [0, 3, 6].some(y => g[y] === g[y + 1] && g[y] === g[y + 2]) },
    { id: 'col',     ok: g => [0, 1, 2].some(x => g[x] === g[x + 3] && g[x] === g[x + 6]) },
    { id: 'mirror',  ok: g => [0, 3, 6].every(y => g[y] === g[y + 2]) },
    { id: 'ring',    ok: g => g[0] === g[1] && g[1] === g[2] && g[2] === g[5] && g[5] === g[8] && g[8] === g[7] && g[7] === g[6] && g[6] === g[3] }
  ];
  function gridFor(rule, r) {
    const g = new Array(9).fill(int(r, 0, 3));
    const k = () => int(r, 0, 3);
    if (rule.id === 'corners') { const c = k(); [0, 2, 6, 8].forEach(i => g[i] = c); g[4] = (c + 1 + int(r, 0, 2)) % 4; [1, 3, 5, 7].forEach(i => g[i] = k()); }
    else if (rule.id === 'row') { const y = pick(r, [0, 3, 6]), c = k(); [0, 1, 2].forEach(d => g[y + d] = c); g.forEach((v, i) => { if (i < y || i > y + 2) g[i] = k(); }); }
    else if (rule.id === 'col') { const x = pick(r, [0, 1, 2]), c = k(); [0, 3, 6].forEach(d => g[x + d] = c); g.forEach((v, i) => { if (i % 3 !== x) g[i] = k(); }); }
    else if (rule.id === 'mirror') { const a = k(), b = k(), c = k(), d = k(), e = k(); g[0] = a; g[2] = a; g[3] = b; g[5] = b; g[6] = c; g[8] = c; g[1] = d; g[7] = e; g[4] = k(); }
    else if (rule.id === 'ring') { const c = k(); [0, 1, 2, 3, 5, 6, 7, 8].forEach(i => g[i] = c); g[4] = (c + 1 + int(r, 0, 2)) % 4; }
    return g;
  }
  function breakRule(rule, g, r) {
    for (let e = 0; e < 80; e++) {
      const c = g.slice();
      const n = 1 + int(r, 0, 1);
      for (let q = 0; q < n; q++) { const j = int(r, 0, 8); let v = int(r, 0, 3); if (v === c[j]) v = (v + 1) % 4; c[j] = v; }
      if (!rule.ok(c)) return c;
    }
    return null;
  }
  function indItem(seed, i) {
    for (let attempt = 0; attempt < 60; attempt++) {
      const r = rng(seed + attempt * 7919);
      const rule = IRULES[int(r, 0, IRULES.length - 1)];
      const ex = [gridFor(rule, r), gridFor(rule, r)];
      const good = [gridFor(rule, r), gridFor(rule, r)];
      const bad = [];
      while (bad.length < 2) { const b = breakRule(rule, gridFor(rule, r), r); if (b) bad.push(b); }
      const cands = shuffle(r, [{ g: good[0], ok: true }, { g: good[1], ok: true }, { g: bad[0], ok: false }, { g: bad[1], ok: false }]);
      /* unicité : une seule règle du catalogue colle aux 2 exemples ET donne exactement la bonne paire */
      const keys = cands.map(c => c.g.join(''));
      if (new Set(keys).size < 4) continue;
      let fitting = 0, goodPair = null;
      for (const ru of IRULES) {
        if (!ex.every(ru.ok)) continue;
        const valid = cands.map((c, idx) => ru.ok(c.g) ? idx : -1).filter(idx => idx >= 0);
        if (valid.length !== 2) continue;
        fitting++;
        if (ru === rule) goodPair = valid;
        else if (valid.join(',') === cands.map((c, idx) => c.ok ? idx : -1).filter(idx => idx >= 0).join(',')) { /* même paire : acceptable */ }
        else { fitting = 99; break; }
      }
      const intended = cands.map((c, idx) => c.ok ? idx : -1).filter(idx => idx >= 0);
      if (fitting !== 1 || !goodPair || goodPair.join(',') !== intended.join(',')) continue;
      return { id: 'I' + i, kind: 'pick2', examples: ex, candidates: cands.map(c => c.g), good: intended };
    }
    /* filet : règle « coins » simple, vérifiée à nouveau */
    const r = rng(seed);
    const rule = IRULES[0];
    const ex = [gridFor(rule, r), gridFor(rule, r)];
    const good = [gridFor(rule, r), gridFor(rule, r)];
    const bad = [breakRule(rule, gridFor(rule, r), r) || new Array(9).fill(0), breakRule(rule, gridFor(rule, r), r) || new Array(9).fill(1)];
    const cands = shuffle(r, [{ g: good[0], ok: true }, { g: good[1], ok: true }, { g: bad[0], ok: false }, { g: bad[1], ok: false }]);
    return { id: 'I' + i, kind: 'pick2', examples: ex, candidates: cands.map(c => c.g), good: cands.map((c, idx) => c.ok ? idx : -1).filter(idx => idx >= 0) };
  }

  /* ══════════════════ CONCENTRATION — E + points ══════════════════ */
  function concItem(seed, i) {
    const r = rng(seed);
    const shapes = ['E', 'E', 'E', 'mirror', 'F', 'nomiddle'];
    const shape = pick(r, shapes);
    const isE = shape === 'E';
    let dots;
    const want = r() < 0.5;
    dots = (isE && want) ? 3 : pick(r, [0, 1, 2, 4, 4, 3]);
    if (!isE && dots === 3) dots = pick(r, [2, 4]);
    const anchors = [[26, 22], [74, 22], [26, 88], [74, 88], [50, 12], [50, 96]];
    const pos = shuffle(r, anchors.map((_, idx) => idx)).slice(0, dots);
    const correct = isE && dots === 3;
    return { id: 'C' + i, kind: 'edots', shape, dots: pos.map(p => anchors[p]), correct };
  }
  function concSVG(shape, dots) {
    const S = 'stroke="#111" stroke-width="9" stroke-linecap="round"';
    let bars = '';
    const vb = 'M28 18 V92';
    const vbM = 'M72 18 V92';
    const h = y => (shape === 'mirror' ? 'M72 ' + y + ' H34' : 'M28 ' + y + ' H66');
    if (shape === 'mirror') {
      bars = '<path d="' + vbM + '" ' + S + '/><path d="' + h(22) + '" ' + S + '/><path d="' + h(55) + '" ' + S + '/><path d="' + h(88) + '" ' + S + '/>';
    } else if (shape === 'F') {
      bars = '<path d="' + vb + '" ' + S + '/><path d="' + h(22) + '" ' + S + '/><path d="' + h(55) + '" ' + S + '/>';
    } else if (shape === 'nomiddle') {
      bars = '<path d="' + vb + '" ' + S + '/><path d="' + h(22) + '" ' + S + '/><path d="' + h(88) + '" ' + S + '/>';
    } else {
      bars = '<path d="' + vb + '" ' + S + '/><path d="' + h(22) + '" ' + S + '/><path d="' + h(55) + '" ' + S + '/><path d="' + h(88) + '" ' + S + '/>';
    }
    const d = dots.map(p => '<circle cx="' + (p[0] * 1.0 + 10) + '" cy="' + (p[1] * 1.0 + 4) + '" r="7" fill="#111"/>').join('');
    return '<svg viewBox="0 0 120 112" xmlns="http://www.w3.org/2000/svg">' + bars + d + '</svg>';
  }

  /* ══════════════════ SWITCH — codes de permutation ══════════════════ */
  const applyCode = (input, code) => code.map(d => input[d - 1]);
  function swItem(seed, i) {
    const r = rng(seed);
    const level = 1 + Math.floor(i / 10);                    /* 1..3 */
    const input = shuffle(r, [0, 1, 2, 3]);
    let code;
    for (let e = 0; e < 40; e++) {
      code = shuffle(r, [1, 2, 3, 4]);
      const moved = code.filter((d, idx) => d !== idx + 1).length;
      if (moved >= level + 1) break;
    }
    const output = applyCode(input, code);
    const opts = [code];
    let guard = 0;
    while (opts.length < 3 && guard++ < 200) {
      const c = shuffle(r, [1, 2, 3, 4]);
      if (c.join('') === code.join('')) continue;
      if (applyCode(input, c).join('') === output.join('')) continue;
      if (opts.some(o => o.join('') === c.join(''))) continue;
      opts.push(c);
    }
    while (opts.length < 3) opts.push(shuffle(r, [1, 2, 3, 4]));
    const sh = shuffle(r, opts);
    return { id: 'S' + i, kind: 'switchcode', input, output, codes: sh, ans: sh.findIndex(c => c.join('') === code.join('')), level };
  }

  /* ══════════════════ MULTI-TÂCHES — switch de consignes ══════════════════ */
  const MT_LETTERS = [['A', 'consonant'], ['E', 'vowel'], ['I', 'vowel'], ['O', 'vowel'], ['U', 'vowel'], ['R', 'consonant'], ['T', 'consonant'], ['M', 'consonant']];
  function mtItem(seed, i) {
    const r = rng(seed);
    const cue = r() < 0.5 ? 'letter' : 'digit';
    const L = pick(r, MT_LETTERS);
    const d = int(r, 1, 9);
    const ans = cue === 'letter' ? L[1] : (d % 2 ? 'odd' : 'even');
    return { id: 'MT' + i, kind: 'mt', cue, letter: L[0], digit: d, ans };
  }

  /* ══════════════════ LEARNING — ordres de sections ══════════════════ */
  function leOrder(seed, sec) { return shuffle(rng(seed + sec * 104729), Array.from({ length: 12 }, (_, i) => i)); }

  /* ══════════════════ NUMÉRIQUE — 6 feuilles + 37 énoncés ══════════════════ */
  const esc = U.esc;
  function table(t) {
    return '<table class="nvtbl"><thead><tr>' + t.head.map((c, i) => '<th class="' + (i ? 'n' : 'k') + '">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
      t.rows.map(r => '<tr' + (t.strong && t.strong.includes(r[0]) ? ' class="s"' : '') + '><td class="k">' + esc(r[0]) + '</td>' +
        r.slice(1).map(v => '<td class="n">' + esc(String(v)) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' +
      (t.note ? '<div class="nvnote">' + esc(t.note) + '</div>' : '');
  }
  const sv = (w, h, inner) => '<svg class="nvsvg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
  const PAL = { 1: '#e08a1e', 2: '#1565c0', 3: '#0d6f78', 4: '#5b3d8f', 5: '#0a8a3c' };
  function pie(segs, note) {
    let a0 = -Math.PI / 2, inner = '';
    segs.forEach((s, i) => {
      const a1 = a0 + s.v / 100 * 2 * Math.PI;
      const x0 = 160 + 95 * Math.cos(a0), y0 = 130 + 95 * Math.sin(a0);
      const x1 = 160 + 95 * Math.cos(a1), y1 = 130 + 95 * Math.sin(a1);
      inner += '<path d="M160 130 L' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A95 95 0 ' + (s.v > 50 ? 1 : 0) + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + PAL[s.c] + '"/>';
      const am = (a0 + a1) / 2;
      inner += '<text x="' + (160 + 62 * Math.cos(am)).toFixed(1) + '" y="' + (130 + 62 * Math.sin(am)).toFixed(1) + '" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">' + s.v + '%</text>';
      a0 = a1;
    });
    inner += segs.map((s, i) => '<rect x="300" y="' + (60 + i * 24) + '" width="13" height="13" fill="' + PAL[s.c] + '"/><text x="320" y="' + (71 + i * 24) + '" font-size="12" fill="#23282c">' + esc(s.n) + '</text>').join('');
    return sv(470, 260, inner) + (note ? '<div class="nvnote">' + esc(note) + '</div>' : '');
  }
  function stacked(series, xl, ylab) {
    const W = 560, H = 300, L = 60, B = 250, top = 30;
    const totals = xl.map((_, i) => series.reduce((a, s) => a + s.v[i], 0));
    const max = Math.ceil(Math.max(...totals) / 2000) * 2000;
    let inner = '<line x1="' + L + '" y1="' + B + '" x2="' + (W - 20) + '" y2="' + B + '" stroke="#cdd4da"/><line x1="' + L + '" y1="' + top + '" x2="' + L + '" y2="' + B + '" stroke="#cdd4da"/>';
    for (let g = 0; g <= 5; g++) { const y = B - (B - top) * g / 5; inner += '<text x="' + (L - 6) + '" y="' + (y + 4) + '" font-size="10" fill="#8a949c" text-anchor="end">' + (max * g / 5 / 1000) + 'k</text><line x1="' + L + '" y1="' + y + '" x2="' + (W - 20) + '" y2="' + y + '" stroke="#eef1f3"/>'; }
    const bw = 62;
    xl.forEach((x, i) => {
      const cx = L + 40 + i * ((W - L - 60) / xl.length);
      let y = B;
      series.forEach(s => {
        const h = (B - top) * s.v[i] / max;
        inner += '<rect x="' + cx + '" y="' + (y - h) + '" width="' + bw + '" height="' + h + '" fill="' + PAL[s.c] + '"/>';
        y -= h;
      });
      inner += '<text x="' + (cx + bw / 2) + '" y="' + (B + 16) + '" font-size="11" fill="#5a656e" text-anchor="middle">' + esc(x) + '</text>';
    });
    inner += series.map((s, i) => '<rect x="' + (L + 10 + i * 130) + '" y="' + (H - 18) + '" width="12" height="12" fill="' + PAL[s.c] + '"/><text x="' + (L + 27 + i * 130) + '" y="' + (H - 8) + '" font-size="11" fill="#23282c">' + esc(s.n) + '</text>').join('');
    inner += '<text x="14" y="' + (top + 4) + '" font-size="10" fill="#8a949c">' + esc(ylab) + '</text>';
    return sv(W, H, inner);
  }
  function lines(series, xl, ylab, ymax) {
    const W = 560, H = 290, L = 52, B = 235, top = 26;
    let inner = '<line x1="' + L + '" y1="' + B + '" x2="' + (W - 20) + '" y2="' + B + '" stroke="#cdd4da"/><line x1="' + L + '" y1="' + top + '" x2="' + L + '" y2="' + B + '" stroke="#cdd4da"/>';
    for (let g = 0; g <= 4; g++) { const y = B - (B - top) * g / 4; inner += '<text x="' + (L - 6) + '" y="' + (y + 4) + '" font-size="10" fill="#8a949c" text-anchor="end">' + (ymax * g / 4).toFixed(0) + '</text><line x1="' + L + '" y1="' + y + '" x2="' + (W - 20) + '" y2="' + y + '" stroke="#eef1f3"/>'; }
    const px = i => L + 40 + i * ((W - L - 80) / (xl.length - 1));
    const py = v => B - (B - top) * v / ymax;
    series.forEach(s => {

      s.v.forEach((v, i) => { inner += '<circle cx="' + px(i) + '" cy="' + py(v) + '" r="3.5" fill="' + PAL[s.c] + '"/>'; });
    });
    xl.forEach((x, i) => { inner += '<text x="' + px(i) + '" y="' + (B + 16) + '" font-size="11" fill="#5a656e" text-anchor="middle">' + esc(x) + '</text>'; });
    inner += series.map((s, i) => '<rect x="' + (L + 10 + i * 150) + '" y="' + (H - 16) + '" width="12" height="12" fill="' + PAL[s.c] + '"/><text x="' + (L + 27 + i * 150) + '" y="' + (H - 6) + '" font-size="11" fill="#23282c">' + esc(s.n) + '</text>').join('');
    inner += '<text x="14" y="' + (top + 2) + '" font-size="10" fill="#8a949c">' + esc(ylab) + '</text>';
    return sv(W, H, inner);
  }
  function hbars(series, xl, xmax) {
    const W = 560, H = 250, L = 110, B = 200;
    const bh = 26, gap = 14;
    let inner = '<line x1="' + L + '" y1="20" x2="' + L + '" y2="' + B + '" stroke="#cdd4da"/>';
    let y = 30;
    series.forEach(s => {
      inner += '<text x="' + (L - 8) + '" y="' + (y + bh / 2 + 4) + '" font-size="11" fill="#23282c" text-anchor="end">' + esc(s.n) + '</text>';
      s.v.forEach((v, i) => {
        const w = (W - L - 60) * v / xmax;
        inner += '<rect x="' + L + '" y="' + (y + i * (bh / 2 + 2)) + '" width="' + w + '" height="' + (bh / 2 - 2) + '" fill="' + PAL[s.c] + '" opacity="' + (1 - i * 0.28) + '"/>' +
          '<text x="' + (L + w + 5) + '" y="' + (y + i * (bh / 2 + 2) + 9) + '" font-size="10" fill="#5a656e">' + v + '</text>';
      });
      y += bh + gap;
    });
    inner += xl.map((x, i) => '<rect x="' + (L + i * 90) + '" y="' + (H - 16) + '" width="12" height="12" fill="#333" opacity="' + (1 - i * 0.28) + '"/><text x="' + (L + 17 + i * 90) + '" y="' + (H - 6) + '" font-size="11" fill="#23282c">' + esc(x) + '</text>').join('');
    return sv(W, H, inner);
  }

  const NV = {
    totalSec: 12 * 60,
    tabs: [
      { id: 'income', name: 'Income' }, { id: 'costs', name: 'Costs' }, { id: 'shares', name: 'Market shares' },
      { id: 'employees', name: 'Employees' }, { id: 'roe', name: 'Return on equity' }, { id: 'outlook', name: 'Outlook' }
    ],
    figures: {
      income: () => table({

          ['Operating income', '11 170', '13 315', '14 275'],
          ['Home Care', '15 240', '16 300', '17 120'],
          ['Personal Care', '14 890', '16 705', '18 040'],
          ['Foods', '8 080', '8 900', '9 200']
        ],

      }),
      costs: () => table({
        head: ['Financial year', 'FY 5', 'FY 6', 'FY 7'],
        rows: [
          ['Personnel costs', '12 480', '13 210', '13 890'],

          ['Depreciation', '2 240', '2 310', '2 395'],
          ['External services', '980', '1 105', '1 180'],
          ['Administration', '860', '905', '940'],
          ['Research & development', '1 420', '1 560', '1 690'],

        ],

      }),

        { n: 'Halden & Roe', v: 44, c: 1 }, { n: 'Corline', v: 39, c: 2 },

      ], 'Segment revenue in the reporting year: 6.2 billion euros.'),
      employees: () => stacked([
        { n: 'United Kingdom', c: 1, v: [4200, 4350, 4480] },

      ], ['FY 5', 'FY 6', 'FY 7'], 'Employees'),
      roe: () => lines([
        { n: 'Halden & Roe group', c: 1, v: [12.4, 14.1, 13.2, 15.6] },
        { n: 'Peer average', c: 2, v: [10.8, 11.2, 11.9, 12.4] },
        { n: 'Corline division', c: 3, v: [8.9, 9.4, 10.8, 11.7] }
      ], ['FY 4', 'FY 5', 'FY 6', 'FY 7'], 'Return (%)', 18),
      outlook: () => hbars([
        { n: 'Home Care', c: 1, v: [18, 19] }, { n: 'Personal Care', c: 2, v: [21, 23] }, { n: 'Foods', c: 3, v: [12, 12] }
      ], ['FY 8', 'FY 9'], 26)
    },
    items: [
      { tab: 'income', q: 'Revenues increased in every year shown.', a: 0, why: '38 210 → 41 905 → 44 360.' },
      { tab: 'income', q: 'Operating income in FY 7 was lower than in FY 6.', a: 1, why: '14 275 > 13 315.' },
      { tab: 'income', q: 'Personal Care revenues grew by more than Home Care revenues between FY 5 and FY 7.', a: 0, why: '+3 150 versus +1 880 million euros.' },
      { tab: 'income', q: 'Foods revenues fell in FY 6.', a: 1, why: '8 080 → 8 900: they rose.' },
      { tab: 'income', q: 'Revenues in FY 7 were more than 15% higher than in FY 5.', a: 0, why: '44 360 / 38 210 = +16.1%.' },

      { tab: 'costs', q: 'Restructuring costs fell in every year shown.', a: 0, why: '540 → 260 → 90.' },

      { tab: 'employees', q: 'Headcount in North America fell between FY 5 and FY 6.', a: 0, why: '1 800 → 1 750.' },
      { tab: 'employees', q: 'In FY 7 the United Kingdom employed more people than all other regions together.', a: 1, why: '4 480 versus 6 070 elsewhere.' },
      { tab: 'employees', q: 'Australia had the smallest headcount in every year shown.', a: 0, why: '700 / 720 / 760: smallest each year.' },
      { tab: 'employees', q: 'In FY 7 the average headcount per production plant exceeded 1 000.', a: 0, why: '10 550 employees / 9 plants ≈ 1 172.' },
      { tab: 'employees', q: 'The group plans to hire in Australia during FY 8.', a: 2, why: 'No FY 8 headcount plan is given.' },
      { tab: 'roe', q: 'Group return on equity exceeded the peer average in every year shown.', a: 0, why: '12.4>10.8; 14.1>11.2; 13.2>11.9; 15.6>12.4.' },

      { tab: 'roe', q: 'Group return on equity reached 15.6% in FY 7.', a: 0, why: 'Stated on the chart.' },
      { tab: 'roe', q: 'The peer average includes Halden & Roe.', a: 2, why: 'The chart does not say how the peer average is computed.' },
      { tab: 'outlook', q: 'The forecast personal care share rises from FY 8 to FY 9.', a: 0, why: '21 → 23.' },
      { tab: 'outlook', q: 'The forecast foods share is unchanged between FY 8 and FY 9.', a: 0, why: '12 and 12.' },
      { tab: 'outlook', q: 'Home Care will overtake Personal Care by FY 9.', a: 1, why: '19 versus 23: it will not.' },
      { tab: 'outlook', q: 'The outlook chart covers three financial years.', a: 1, why: 'FY 8 and FY 9 only.' },
      { tab: 'costs', q: 'Total costs grew more slowly than revenues between FY 5 and FY 7.', a: 0, why: 'Costs +11.3% versus revenues +16.1%.' },
      { tab: 'income', q: 'The operating margin (operating income / revenues) improved between FY 5 and FY 7.', a: 0, why: '29.2% → 32.2%.' },
      { tab: 'employees', q: 'In FY 7 the group employed more people in North America than in Australia.', a: 0, why: '1 900 versus 760.' },
      { tab: 'shares', q: 'The Halden & Roe share equals the combined shares of Corline and Bruma.', a: 1, why: '44% versus 51%.' }
    ].map((x, i) => Object.assign({ id: 'NV' + (i + 1), kind: 'numverb' }, x))
  };

  return { dedItem, indItem, concItem, concSVG, swItem, applyCode, mtItem, leOrder, NV, table, pie, stacked, lines, hbars };
})();
