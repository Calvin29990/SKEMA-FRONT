<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment Trainer — Calvin MINANG</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Plateforme personnelle d'entraînement aux tests d'évaluation bancaires (cut-e / Aon / Maki). Usage strictement personnel — Calvin MINANG.">
<style>
/* ═══════════════════════════════════════════════════════════════
   Assessment Trainer — Calvin MINANG
   Design épuré clair (réplique plateforme d'évaluation type
   Crédit Agricole CIB / cut-e). Thème sombre disponible en option.
   ═══════════════════════════════════════════════════════════════ */

/* aucune police ni ressource externe : tout est servi en local */
:root{
  --bg:#eef1f3; --bg2:#f7f9fa;
  --card:#ffffff; --card2:#f4f6f8;
  --line:#e2e6ea; --line2:#cdd4da;
  --tx:#23282c; --tx2:#5a656e; --tx3:#8a949c;
  --grn:#0a8a3c; --grn-d:#076a2c; --grn-bg:#eaf6ee;
  --amb:#a9741a; --amb-bg:#fdf4e3;
  --red:#c62828; --red-bg:#fdecec;
  --blu:#1565c0; --blu-bg:#eaf1fb;
  --pur:#5b3d8f; --pur-bg:#f1ecfa;
  --teal:#0d6f78;
  --r:4px; --r2:6px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sh:0 1px 3px rgba(23,32,41,.08), 0 6px 22px rgba(23,32,41,.05);
  --sh2:0 2px 6px rgba(23,32,41,.10);
}

/* ───── Thème sombre (option) ───── */
html[data-theme="dark"]{
  --bg:#0d1117; --bg2:#111823;
  --card:#161b22; --card2:#1c2430;
  --line:#242c38; --line2:#323c4d;
  --tx:#e6edf3; --tx2:#9aa7b8; --tx3:#6b7787;
  --grn:#2ecc8f; --grn-d:#0f7b5f; --grn-bg:rgba(46,204,143,.10);
  --amb:#e3b341; --amb-bg:rgba(227,179,65,.12);
  --red:#f0616d; --red-bg:rgba(240,97,109,.12);
  --blu:#58a6ff; --blu-bg:rgba(88,166,255,.12);
  --pur:#a371f7; --pur-bg:rgba(163,113,247,.12);
  --teal:#39c5cf;
  --sh:0 8px 28px rgba(0,0,0,.35);
  --sh2:0 2px 8px rgba(0,0,0,.3);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--tx); font-size:14px;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh; display:flex; flex-direction:column;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--card);color:var(--tx);
  border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--grn)}
::selection{background:var(--grn);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ══════════ En-tête ══════════ */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--card);
  border-bottom:1px solid var(--line);padding:0 26px;
  display:flex;align-items:center;gap:26px;min-height:64px;
}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;flex-shrink:0;padding:8px 0}
.brand-mark{
  width:40px;height:40px;border-radius:var(--r);flex-shrink:0;
  background:var(--grn);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;
}
.brand-title{font-size:14.5px;font-weight:700;letter-spacing:.2px;color:var(--tx);line-height:1.15}
.brand-sub{font-size:10.5px;color:var(--tx3);letter-spacing:.3px}

.mainnav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.navlink{
  padding:9px 11px;font-size:13px;color:var(--tx2);font-weight:500;
  border-bottom:2px solid transparent;transition:.15s;
}
.navlink:hover{color:var(--grn)}
.navlink.on{color:var(--grn);border-bottom-color:var(--grn);font-weight:600}

.topright{display:flex;align-items:center;gap:14px;flex-shrink:0}
.langsel{padding:5px 7px;font-size:12px;border-radius:var(--r);background:var(--card);color:var(--tx2);max-width:150px}
.tlang{max-width:132px;font-size:11.5px}
.switch{
  position:relative;width:40px;height:20px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line2);cursor:pointer;transition:.18s;flex-shrink:0;
}
.switch i{
  position:absolute;top:1.5px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--tx3);transition:.18s;
}
.switch.on{background:var(--grn-bg);border-color:var(--grn)}
.switch.on i{left:21px;background:var(--grn)}
.userchip{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);
  padding:5px 10px;border:1px solid var(--line);border-radius:20px;background:var(--bg2);
  white-space:nowrap;
}
.userchip b{color:var(--tx);font-weight:600}
.burger{display:none;font-size:20px;padding:4px 10px}
.hud{display:none;align-items:center;gap:8px;flex:1;justify-content:center;flex-wrap:wrap}
.hud.on{display:flex}

/* ══════════ Structure ══════════ */
.view{flex:1;padding:24px 22px 64px;max-width:1080px;width:100%;margin:0 auto}
.view.wide{max-width:1400px}
.footer{
  border-top:1px solid var(--line);padding:14px 26px;display:flex;gap:14px;
  justify-content:space-between;flex-wrap:wrap;font-size:11px;color:var(--tx3);background:var(--card);
}
.footer strong{color:var(--tx2)}

/* « page » blanche centrale, comme sur la plateforme d'origine */
.pagecard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  padding:26px 30px 22px;box-shadow:var(--sh);
}
.pagecard h1{font-size:21px;font-weight:600;letter-spacing:-.1px;margin-bottom:14px;color:var(--tx)}
.intro{font-size:12.5px;color:var(--tx2);line-height:1.75;max-width:900px;margin-bottom:26px}

/* ══════════ Typo ══════════ */
h1{font-size:24px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
h2{font-size:16px;font-weight:600;letter-spacing:-.1px;margin:24px 0 12px}
h3{font-size:14px;font-weight:700;margin-bottom:8px}
.lead{color:var(--tx2);font-size:13px;max-width:800px}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.small{font-size:12px}.tiny{font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.sp{margin-top:12px}.sp2{margin-top:22px}
.hr{height:1px;background:var(--line);margin:20px 0}

/* ══════════ Cartes ══════════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;box-shadow:var(--sh)}
.card.pad-s{padding:13px 15px}
.card-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--grn);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:3px;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;background:var(--card2);
  border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.tag.grn{background:var(--grn-bg);border-color:#bfe0cb;color:var(--grn-d)}
.tag.amb{background:var(--amb-bg);border-color:#ecd9ac;color:var(--amb)}
.tag.red{background:var(--red-bg);border-color:#f0c4c4;color:var(--red)}
.tag.blu{background:var(--blu-bg);border-color:#c3d8f2;color:var(--blu)}
html[data-theme="dark"] .tag.grn{border-color:rgba(46,204,143,.35)}
html[data-theme="dark"] .tag.amb{border-color:rgba(227,179,65,.35)}
html[data-theme="dark"] .tag.red{border-color:rgba(240,97,109,.35)}
html[data-theme="dark"] .tag.blu{border-color:rgba(88,166,255,.35)}

/* ══════════ Boutons ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;
  border:1px solid var(--line2);background:var(--card);color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--tx3);background:var(--bg2)}
.btn.pri{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--grn-d);border-color:var(--grn-d)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.lg{padding:12px 28px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:#e6b9b9;color:var(--red);background:var(--card)}
.btn.danger:hover{background:var(--red-bg)}

/* ══════════ Tableau des tâches ══════════ */
.taskhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:6px}
.taskhead h2{margin:0;font-size:15.5px;font-weight:500;color:var(--tx)}
.progwrap{min-width:320px;flex:0 1 420px}
.progwrap .plabel{font-size:11.5px;color:var(--tx2);text-align:right}
.progwrap .pcount{font-size:11.5px;color:var(--tx2);text-align:right;font-weight:600}
.progbar{display:flex;gap:1px;margin-top:7px;background:var(--line2);border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.progbar i{flex:1;height:11px;background:#e9ecef}
html[data-theme="dark"] .progbar i{background:#1b2430}
.progbar i.f{background:var(--grn)}

.tasktable{border-top:1px solid var(--line);margin-top:16px}
.trow{
  display:grid;grid-template-columns:30px minmax(180px,1fr) auto auto auto;
  align-items:center;gap:16px;padding:17px 4px;border-bottom:1px solid var(--line);
  transition:background .14s;
}
.trow:hover{background:var(--bg2)}
.trow .tico{display:flex;align-items:center;justify-content:center;width:20px}
.trow .tico svg{width:17px;height:17px;stroke:var(--tx3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.trow.st-done .tico svg{stroke:var(--grn)}
.trow.st-prog .tico svg{stroke:var(--amb)}
.tname{font-size:14px;color:var(--tx);display:flex;align-items:center;gap:10px;min-width:0}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchev{
  color:var(--tx3);cursor:pointer;font-size:10px;line-height:1;padding:5px 7px;
  border:1px solid transparent;border-radius:3px;transition:.15s;flex-shrink:0;
}
.tchev:hover{border-color:var(--line2);color:var(--grn)}
.trow.open .tchev{transform:rotate(180deg)}
/* badge de format visible sans déplier la ligne (numerical au format réel) */
.tfmt{
  overflow:visible;white-space:nowrap;flex-shrink:0;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  color:var(--amb);background:var(--amb-bg,var(--bg2));border:1px solid var(--line2);
  border-radius:3px;padding:2px 7px;
}
@media (max-width:900px){ .tfmt{display:none} }
.tdur{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tdur svg{width:13px;height:13px;stroke:var(--tx3);fill:none;stroke-width:1.5}
.tlang{border:1px solid var(--line2);background:var(--card);border-radius:3px;padding:6px 8px;font-size:11.5px;color:var(--tx2);min-width:132px}
.tstart{
  background:var(--grn);color:#fff;border-radius:3px;padding:9px 24px;
  font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  transition:.15s;white-space:nowrap;
}
.tstart:hover{background:var(--grn-d)}
.trow.st-done .tstart{background:var(--card);color:var(--grn);border:1px solid var(--grn)}
.trow.st-done .tstart:hover{background:var(--grn-bg)}
.tdetails{grid-column:1/-1;padding:2px 0 6px 46px;display:none}
.trow.open + .tdetails{display:block}
.tdetails .d{font-size:12.5px;color:var(--tx2);line-height:1.7;max-width:760px}
.tdetails .hint{margin-top:8px;padding:9px 12px;background:var(--grn-bg);border-left:2px solid var(--grn);
  font-size:12px;color:var(--tx2);border-radius:0 var(--r) var(--r) 0}
.tdetails .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* légende des états */
.legend{
  display:grid;grid-template-columns:repeat(7,1fr);gap:10px;
  margin-top:26px;padding-top:22px;border-top:1px solid var(--line);
}
.li{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:10.5px;color:var(--tx2);text-align:center;line-height:1.35}
.li svg{width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ══════════ Résumé d'activité (sous la carte) ══════════ */
.summarystrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;box-shadow:var(--sh)}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:600}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-top:3px}
.stat .s{font-size:11px;color:var(--tx3);margin-top:2px}

/* ══════════ Onglets de familles ══════════ */
.secbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.secbar button{
  padding:6px 13px;border-radius:20px;border:1px solid var(--line2);background:var(--card);
  font-size:12px;color:var(--tx2);font-weight:600;
}
.secbar button.on{background:var(--grn);border-color:var(--grn);color:#fff}

/* ══════════ Cartes de section (vue « toutes les sections ») ══════════ */
.sect{display:flex;align-items:flex-start;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);padding:15px 17px;cursor:pointer;transition:.16s;text-align:left;width:100%;box-shadow:var(--sh)}
.sect:hover{border-color:var(--grn);transform:translateY(-1px);box-shadow:var(--sh2)}
.sect-ico{width:40px;height:40px;border-radius:var(--r);flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:18px;background:var(--bg2);border:1px solid var(--line)}
.sect-body{flex:1;min-width:0}
.sect-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect-desc{font-size:12px;color:var(--tx2);margin-top:3px}
.sect-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.sect-stats{text-align:right;flex-shrink:0;min-width:74px}

/* ══════════ Session ══════════ */
.runner{max-width:880px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}
.qlabel{font-size:11px;font-weight:700;color:var(--grn);text-transform:uppercase;letter-spacing:1px}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:8px 0 18px;color:var(--tx)}
.qtext.sm{font-size:15.5px}
.qpassage{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--blu);
  border-radius:0 var(--r) var(--r) 0;padding:15px 17px;font-size:14px;line-height:1.75;margin-bottom:16px;color:var(--tx)}
.qtbl{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0 16px;background:var(--card)}
.qtbl th{background:var(--bg2);padding:9px 12px;text-align:left;font-weight:700;
  border-bottom:1px solid var(--line2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2)}
.qtbl td{padding:9px 12px;border-bottom:1px solid var(--line)}
.qtbl tr:last-child td{border-bottom:none}
.qtbl .num{font-family:var(--mono);text-align:right}

.qbody{min-height:260px}
.timerline{height:4px;border-radius:3px;background:var(--card2);overflow:hidden;margin-bottom:16px}
.timerline i{display:block;height:100%;background:var(--grn);transition:width .1s linear}
.timerline i.w{background:#e0a72b}
.timerline i.d{background:var(--red)}

.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line2);
  border-radius:var(--r);padding:13px 16px;font-size:13.5px;line-height:1.5;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--grn);background:var(--bg2)}
.opt .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:transparent}
.opt.sel{border-color:var(--grn);background:var(--grn-bg)}
.opt.sel .mk{border-color:var(--grn);background:var(--grn);color:#fff}
.opt.ok{border-color:var(--grn);background:var(--grn-bg)}
.opt.ko{border-color:var(--red);background:var(--red-bg)}
.opt.ko .mk{border-color:var(--red);background:var(--red);color:#fff}
.opt.dim{opacity:.5}
.keys{font-family:var(--mono);font-size:10.5px;color:var(--tx3);margin-left:auto;
  border:1px solid var(--line2);border-radius:3px;padding:1px 6px}

/* switch challenge */
.dnd-rail{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
.dnd-slot{width:70px;height:70px;border-radius:6px;border:2px dashed var(--line2);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:22px;
  font-weight:700;color:var(--tx);position:relative;transition:.14s}
.dnd-slot.filled{border-style:solid;background:var(--bg2)}
.dnd-slot .idx{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--card);
  border:1px solid var(--line2);color:var(--tx3);font-size:9px;padding:1px 6px;border-radius:8px;
  font-family:'Inter',sans-serif}
.dnd-ops{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.dnd-op{display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line2);font-family:var(--mono);font-size:14px;
  font-weight:700;color:var(--tx);transition:.14s}
.dnd-op:hover{border-color:var(--grn)}
.dnd-op.on{border-color:var(--grn);background:var(--grn-bg)}
.dnd-op.ko{border-color:var(--red);background:var(--red-bg)}
.dnd-op small{font-family:'Inter';font-size:9.5px;color:var(--tx3);font-weight:600}

/* figures */
.symgrid{display:grid;gap:9px;justify-content:center;margin:18px auto;width:fit-content}
.sym{width:62px;height:62px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);
  display:flex;align-items:center;justify-content:center;transition:.14s;position:relative}
.sym.opt{cursor:pointer}
.sym.opt:hover{border-color:var(--grn);transform:scale(1.04)}
.sym.sel{border-color:var(--grn);background:var(--grn-bg)}
.sym.ok{border-color:var(--grn);background:var(--grn-bg)}
.sym.ko{border-color:var(--red);background:var(--red-bg)}
.sym.hidden{opacity:.15}
.sym.unknown::after{content:'?';font-size:24px;font-weight:800;color:var(--grn);opacity:.7}
.mat{width:100%;height:100%;position:relative;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mat.single{grid-template-columns:1fr;grid-template-rows:1fr}
.mat i{display:flex;align-items:center;justify-content:center;font-style:normal}
.mat i svg{width:74%;height:74%}

/* grilles mémoire */
.gridmem{display:grid;gap:6px;justify-content:center;margin:16px auto;width:fit-content}
.gm{width:50px;height:50px;border-radius:5px;border:2px solid transparent;display:flex;
  align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;
  font-family:var(--mono);transition:.1s;cursor:pointer}
.gm.edge{border-color:var(--line2);background:var(--card)}
.gm.blue{background:#1565c0}.gm.gold{background:#b58100}.gm.red{background:#c62828}
.gm.pur{background:#5b3d8f}.gm.grn{background:#0a8a3c}.gm.gray{background:#5a656e}
.gm.spark{box-shadow:0 0 0 3px #f5c451,0 0 16px rgba(245,196,81,.8)}
.gm.blank{background:var(--card)}
.gm.selected{background:var(--grn)}

/* figures / mécanique */
.figbox{display:flex;justify-content:center;align-items:center;margin:14px 0 18px;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.figrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.numcmp{display:flex;gap:24px;justify-content:center;align-items:center;flex-wrap:wrap;margin:24px 0}
.numbox{padding:24px 32px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--card);
  font-family:var(--mono);font-size:32px;font-weight:700;min-width:140px;text-align:center}

/* ══════════ Résultats ══════════ */
.scorebig{font-size:58px;font-weight:800;line-height:1;letter-spacing:-2px}
.scorebig.pass{color:var(--grn)}.scorebig.mid{color:#c9922a}.scorebig.fail{color:var(--red)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:12px;font-size:12.5px}
.bar-name{flex:1;min-width:110px;color:var(--tx2)}
.bar-track{flex:2;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;min-width:90px}
.bar-track i{display:block;height:100%;background:var(--grn);border-radius:4px;transition:width .4s}
.bar-track i.amb{background:#d9a12c}.bar-track i.red{background:var(--red)}
.bar-val{width:56px;text-align:right;font-family:var(--mono);font-size:12px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;padding:9px 11px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--tx3);border-bottom:1px solid var(--line2);font-weight:700}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--bg2)}
.tbl .num{font-family:var(--mono);text-align:right}

/* feedback */
.fb{border-radius:var(--r);padding:13px 15px;border:1px solid var(--line);background:var(--card);margin-bottom:11px;font-size:13px}
.fb.ok{border-color:#bfe0cb;background:var(--grn-bg)}
.fb.ko{border-color:#f0c4c4;background:var(--red-bg)}
html[data-theme="dark"] .fb.ok{border-color:rgba(46,204,143,.35)}
html[data-theme="dark"] .fb.ko{border-color:rgba(240,97,109,.35)}
.fb-t{font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}

/* listes */
.ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.ul li{padding-left:20px;position:relative;font-size:12.5px;color:var(--tx2);line-height:1.65}
.ul li::before{content:'▸';position:absolute;left:0;color:var(--grn);font-weight:700}
.ul.num{counter-reset:c}
.ul.num li{counter-increment:c;padding-left:28px}
.ul.num li::before{content:counter(c);left:0;top:2px;width:18px;height:18px;border-radius:50%;
  background:var(--grn-bg);border:1px solid #bfe0cb;color:var(--grn-d);display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800}

/* ══════════ Modales / toasts ══════════ */
.modal-back{position:fixed;inset:0;background:rgba(23,32,41,.5);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:22px}
/* l'attribut hidden doit gagner contre display:flex, sinon le voile couvre l'écran en permanence */
.modal-back[hidden]{display:none !important}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:var(--r2);
  max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--sh)}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--grn);
  border-radius:var(--r);padding:11px 15px;font-size:12.5px;min-width:220px;box-shadow:var(--sh2);
  animation:slidein .2s ease;color:var(--tx)}
.toast.err{border-left-color:var(--red)}
.toast.warn{border-left-color:#d9a12c}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* ══════════ Divers ══════════ */
.kbd{font-family:var(--mono);font-size:10.5px;background:var(--card2);border:1px solid var(--line2);
  border-radius:3px;padding:2px 6px;color:var(--tx2)}
.dropzone{border:2px dashed var(--line2);border-radius:var(--r2);padding:32px;text-align:center;
  background:var(--card);transition:.16s;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--grn);background:var(--grn-bg)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.shot{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.shot img{width:100%;display:block;background:#000}
.shot .cap{padding:8px 10px;font-size:11px;color:var(--tx2);display:flex;justify-content:space-between;
  gap:6px;align-items:center;border-top:1px solid var(--line)}
.shot .cap button{color:var(--red);font-size:11px}
.progress{height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grn)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .t{font-size:13px;font-weight:600}
.setrow .d{font-size:11.5px;color:var(--tx3);margin-top:2px}
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat i{width:13px;height:13px;border-radius:2px;background:var(--card2);border:1px solid var(--line)}
.heat i.l1{background:#c8e6d2}.heat i.l2{background:#8fd0a7}.heat i.l3{background:#3faa68}.heat i.l4{background:var(--grn)}

/* pills (HUD de session) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;
  background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap;color:var(--tx2)}
.pill .k{color:var(--tx3);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.pill.mono{font-family:var(--mono);font-size:12.5px}
.pill.warn{background:var(--amb-bg);border-color:#ecd9ac;color:var(--amb)}
.pill.danger{background:var(--red-bg);border-color:#f0c4c4;color:var(--red)}
.pill.good{background:var(--grn-bg);border-color:#bfe0cb;color:var(--grn-d)}
.pill.miss{background:var(--red-bg);border-color:#f0c4c4;color:var(--red)}
.pill.hit{background:var(--grn-bg);border-color:#bfe0cb;color:var(--grn-d)}
html[data-theme="dark"] .pill.warn{border-color:rgba(227,179,65,.35)}
html[data-theme="dark"] .pill.danger,html[data-theme="dark"] .pill.miss{border-color:rgba(240,97,109,.35)}
html[data-theme="dark"] .pill.good,html[data-theme="dark"] .pill.hit{border-color:rgba(46,204,143,.35)}

/* ══════════ Responsive ══════════ */
@media (max-width:980px){
  .topbar{flex-wrap:wrap;padding:0 16px;gap:14px}
  .brand-text{display:none}
  .mainnav{order:3;flex:1 1 100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .navlink{white-space:nowrap}
  .burger{display:block;order:9}
  .topright{margin-left:auto}

  .taskhead{flex-direction:column;align-items:stretch}

  .trow{grid-template-columns:26px 1fr;gap:10px 12px;padding:14px 2px}
  .trow .tdur,.trow .tlang,.trow .tstart{grid-column:2;justify-self:start}
  .trow .tstart{width:100%;text-align:center}
  .tdetails{padding-left:38px}
  .legend{grid-template-columns:repeat(3,1fr);row-gap:18px}
  .view{padding:16px 13px 50px}
  .pagecard{padding:18px 16px 16px}
  .scorebig{font-size:46px}
  .sym{width:50px;height:50px}
  .dnd-slot{width:58px;height:58px;font-size:18px}
  .gm{width:42px;height:42px;font-size:17px}
}
@media (max-width:620px){
  .legend{grid-template-columns:repeat(2,1fr)}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
@media print{
  .topbar,.footer,.mainnav,.burger,.topright{display:none}

}

   DÉTAIL QUESTION PAR QUESTION
   ══════════════════════════════════════════════════════════════ */
.qtbl2{width:100%;border-collapse:collapse;font-size:12.5px}

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   util.js — utilitaires partagés (RNG, DOM, stockage, figures SVG)
   Assessment Trainer — Calvin MINANG
   ═══════════════════════════════════════════════════════════════ */
'use strict';

const U = (() => {

  /* ─────────── RNG déterministe (mulberry32) ─────────── */
  function rng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const int = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function shuffle(r, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function sample(r, arr, n) { return shuffle(r, arr).slice(0, n); }
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

  /* ─────────── Formatage ─────────── */
  const pct = (n, d = 0) => (n === null || n === undefined || isNaN(n)) ? '—' : (n * 100).toFixed(d) + '%';
  const ms = (n) => n == null ? '—' : (n < 1000 ? Math.round(n) + ' ms' : (n / 1000).toFixed(1) + ' s');
  const num = (n, d = 1) => n == null || isNaN(n) ? '—' : Number(n).toFixed(d);
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fr = (iso) => { const d = new Date(iso); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
  const dayKey = (d = new Date()) => d.toISOString().slice(0, 10);
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

  /* ─────────── Stockage ─────────── */
  const NS = 'skemaTrainer.v1.';
  const store = {
    get(k, def) {
      try { const v = localStorage.getItem(NS + k); return v === null ? def : JSON.parse(v); }
      catch (e) { return def; }
    },
    set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { toast('Stockage local plein ou bloqué', 'err'); return false; } },
    del(k) { try { localStorage.removeItem(NS + k); } catch (e) {} },
    keys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(NS)) out.push(k.slice(NS.length)); } } catch (e) {} return out; },
    wipe() { this.keys().forEach(k => this.del(k)); },
    size() { let b = 0; this.keys().forEach(k => { try { b += (localStorage.getItem(NS + k) || '').length; } catch (e) {} }); return b; }
  };

  /* ─────────── DOM ─────────── */
  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
  function el(tag, attrs, html) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'dataset') Object.assign(n.dataset, attrs[k]);
      else if (k.startsWith('on') && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (html != null) n.innerHTML = html;
    return n;
  }
  const frag = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content; };

  /* ─────────── Toasts ─────────── */
  function toast(msg, type, ttl = 3200) {
    const wrap = $('#toastWrap'); if (!wrap) return;
    const n = el('div', { class: 'toast ' + (type || '') }, msg);
    wrap.appendChild(n);
    setTimeout(() => { n.style.opacity = '0'; n.style.transform = 'translateX(30px)'; setTimeout(() => n.remove(), 220); }, ttl);
  }

  /* ─────────── Modale ─────────── */
  function modal(html) {
    const back = $('#modalBack'), box = $('#modalBox');
    box.innerHTML = html; back.hidden = false; back.style.display = 'flex';
    back.onclick = (e) => { if (e.target === back) closeModal(); };
    document.addEventListener('keydown', escClose);
  }
  function escClose(e) { if (e.key === 'Escape') closeModal(); }
  function closeModal() {
    const b = $('#modalBack');
    if (b) { b.hidden = true; b.style.display = 'none'; }
    document.removeEventListener('keydown', escClose);
  }

  /* ─────────── Sons (bips WebAudio, sans fichier externe) ─────────── */
  let actx = null;
  function beep(kind = 'ok') {
    if (!store.get('settings', {}).sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const f = { ok: 660, ko: 190, tick: 420, end: 520 }[kind] || 500;
      o.type = kind === 'ko' ? 'sawtooth' : 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (kind === 'tick' ? 0.07 : 0.18));
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.2);
    } catch (e) {}
  }

  /* ═══════════════════════════════════════════════════════════
     FIGURES SVG — moteur unique.
     Les figures sont décrites par un "kind" + couleur + options,
     ce qui garantit des formes IDENTIQUES d'un tirage à l'autre
     (aucune déformation possible : géométrie paramétrique fixe).
     ═══════════════════════════════════════════════════════════ */
  const C = {
    ink: '#23282c', grn: '#0a8a3c', amb: '#b58100', red: '#c62828',
    blu: '#1565c0', pur: '#5b3d8f', gray: '#5a656e', teal: '#0d6f78', pink: '#b5317a'
  };
  const PALETTE = [C.grn, C.amb, C.red, C.blu, C.pur, C.teal, C.pink, C.ink];

  function svg(inner, vb = 100) {
    return '<svg viewBox="0 0 ' + vb + ' ' + vb + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  /** Forme élémentaire. kind ∈ liste ci-dessous. color = couleur. opts spécifiques. */
  function shape(kind, color, o = {}) {
    const c = color || C.ink, sw = o.sw || 7;
    const S = { 'stroke': c, 'stroke-width': sw, 'fill': 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
    const A = (d) => '<path d="' + d + '" ' + attrs(S) + '/>';
    switch (kind) {
      /* lignes directionnelles (concentration / cut-e) */
      case 'line-up': return svg(A('M10 82 L30 50 L50 66 L72 26 L90 38'));
      case 'line-down': return svg(A('M10 20 L30 52 L50 36 L72 76 L90 64'));
      case 'line-updown': return svg(A('M10 72 L32 30 L52 62 L74 24 L90 48'));
      case 'line-downup': return svg(A('M10 28 L32 70 L52 38 L74 76 L90 52'));
      case 'line-wave': return svg(A('M8 52 Q26 18 44 52 T80 52 T108 52'));
      case 'line-flat': return svg(A('M10 52 L30 44 L50 58 L70 46 L90 55'));
      case 'line-step': return svg(A('M10 78 L32 78 L32 52 L54 52 L54 28 L80 28 L80 14'));
      /* flèches */
      case 'arr-up': return svg('<path d="M50 88 L50 20 M28 42 L50 18 L72 42" ' + attrs(S) + '/>');
      case 'arr-down': return svg('<path d="M50 12 L50 80 M28 58 L50 82 L72 58" ' + attrs(S) + '/>');
      case 'arr-right': return svg('<path d="M12 50 L80 50 M58 28 L82 50 L58 72" ' + attrs(S) + '/>');
      case 'arr-left': return svg('<path d="M88 50 L20 50 M42 28 L18 50 L42 72" ' + attrs(S) + '/>');
      case 'chev-up': return svg(A('M22 66 L50 32 L78 66'));
      case 'chev-down': return svg(A('M22 34 L50 68 L78 34'));
      /* points */
      case 'dot-1': return svg('<circle cx="50" cy="50" r="18" fill="' + c + '"/>');
      case 'dot-2': return svg('<circle cx="30" cy="50" r="15" fill="' + c + '"/><circle cx="70" cy="50" r="15" fill="' + c + '"/>');
      case 'dot-3': return svg('<circle cx="50" cy="26" r="13" fill="' + c + '"/><circle cx="28" cy="68" r="13" fill="' + c + '"/><circle cx="72" cy="68" r="13" fill="' + c + '"/>');
      case 'dot-ring': return svg('<circle cx="50" cy="50" r="30" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><circle cx="50" cy="50" r="9" fill="' + c + '"/>');
      case 'dot-sq': return svg('<circle cx="50" cy="50" r="32" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><rect x="36" y="36" width="28" height="28" fill="' + c + '"/>');
      /* cercles / disques */
      case 'circle': return svg('<circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'disc': return svg('<circle cx="50" cy="50" r="34" fill="' + c + '"/>');
      case 'half-top': return svg('<path d="M16 50 A34 34 0 0 1 84 50 Z" fill="' + c + '"/><circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'half-left': return svg('<path d="M50 84 A34 34 0 0 1 50 16 Z" fill="' + c + '"/><circle cx="50" cy="50" r="34" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'quarter': return svg('<path d="M16 50 A34 34 0 0 1 50 16 L50 50 Z" fill="' + c + '"/>');
      /* carrés */
      case 'square': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'square-full': return svg('<rect x="18" y="18" width="64" height="64" fill="' + c + '"/>');
      case 'square-rot': return svg('<rect x="50" y="10" width="56" height="56" transform="rotate(45 50 50)" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'square-half': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><rect x="18" y="50" width="64" height="32" fill="' + c + '"/>');
      case 'square-diag': return svg('<rect x="18" y="18" width="64" height="64" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/><path d="M18 82 L82 18" ' + attrs({ stroke: c, 'stroke-width': sw }) + '/>');
      /* triangles */
      case 'tri-up': return svg('<path d="M50 16 L86 84 L14 84 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-down': return svg('<path d="M50 84 L86 16 L14 16 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-left': return svg('<path d="M16 50 L84 86 L84 14 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-right': return svg('<path d="M84 50 L16 86 L16 14 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'tri-full': return svg('<path d="M50 16 L86 84 L14 84 Z" fill="' + c + '"/>');
      /* croix / plus / étoile */
      case 'cross': return svg(A('M22 22 L78 78 M78 22 L22 78'));
      case 'plus': return svg(A('M50 18 L50 82 M18 50 L82 50'));
      case 'star': return svg('<path d="M50 12 L60 40 L90 40 L66 58 L75 88 L50 70 L25 88 L34 58 L10 40 L40 40 Z" ' + attrs({ stroke: c, 'stroke-width': 5, fill: 'none' }) + '/>');
      /* divers */
      case 'moon': return svg('<path d="M62 14 A38 38 0 1 0 62 86 A30 30 0 1 1 62 14 Z" fill="' + c + '"/>');
      case 'diamond': return svg('<path d="M50 14 L86 50 L50 86 L14 50 Z" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
      case 'lshape': return svg(A('M22 20 L22 80 L80 80'));
      case 'zshape': return svg(A('M22 24 L80 24 L22 78 L80 78'));
      /* horloge (test mécanique) */
      case 'clock': {
        const h = ((o.hour || 3) % 12) * 30, m = (o.min || 0) * 6;
        return svg(
          '<circle cx="50" cy="50" r="38" ' + attrs({ stroke: c, 'stroke-width': 5, fill: 'none' }) + '/>' +
          '<line x1="50" y1="50" x2="' + (50 + 20 * Math.sin(h * Math.PI / 180)) + '" y2="' + (50 - 20 * Math.cos(h * Math.PI / 180)) + '" stroke="' + c + '" stroke-width="6" stroke-linecap="round"/>' +
          '<line x1="50" y1="50" x2="' + (50 + 30 * Math.sin(m * Math.PI / 180)) + '" y2="' + (50 - 30 * Math.cos(m * Math.PI / 180)) + '" stroke="' + c + '" stroke-width="4" stroke-linecap="round"/>' +
          '<circle cx="50" cy="50" r="3.5" fill="' + c + '"/>'
        );
      }
      case 'gear': {
        let t = '';
        for (let i = 0; i < 8; i++) {
          const a = i * 45 * Math.PI / 180;
          t += '<rect x="' + (50 + 28 * Math.cos(a) - 5) + '" y="' + (50 + 28 * Math.sin(a) - 5) + '" width="10" height="10" fill="' + c + '"/>';
        }
        return svg('<circle cx="50" cy="50" r="28" ' + attrs({ stroke: c, 'stroke-width': 8, fill: 'none' }) + '/>' + t);
      }
      /* flèche courbe (sens de rotation) */
      case 'rot-cw': return svg('<path d="M22 50 A28 28 0 1 1 50 78" ' + attrs(S) + '/><path d="M50 78 L36 70 M50 78 L38 90" ' + attrs(S) + '/>');
      case 'rot-ccw': return svg('<path d="M78 50 A28 28 0 1 1 50 22" ' + attrs(S) + '/><path d="M50 22 L64 30 M50 22 L62 10" ' + attrs(S) + '/>');
      default: return svg('<rect x="22" y="22" width="56" height="56" rx="8" ' + attrs({ stroke: c, 'stroke-width': sw, fill: 'none' }) + '/>');
    }
  }
  function attrs(o) { return Object.keys(o).map(k => k + '="' + o[k] + '"').join(' '); }

  /** Chiffre 1-9 en SVG, tracé au centre (Switch Challenge). */
  function digitSVG(d, color) {
    const c = color || C.ink;
    return svg('<text x="50" y="72" font-family="JetBrains Mono, monospace" font-size="72" font-weight="700" fill="' + c + '" text-anchor="middle">' + d + '</text>');
  }

  /** Tuile = case de grille pouvant contenir : rien, une forme, un chiffre, une lettre. */
  function tile(spec, size) {
    if (spec == null) return '<div class="mat"></div>';
    const cls = 'mat' + (spec.single ? ' single' : '');
    let inner = '';
    if (spec.type === 'digit') inner = digitSVG(spec.v, spec.color);
    else if (spec.type === 'letter') inner = svg('<text x="50" y="74" font-family="Inter" font-size="66" font-weight="800" fill="' + (spec.color || C.ink) + '" text-anchor="middle">' + esc(spec.v) + '</text>');
    else if (spec.type === 'shape') inner = shape(spec.kind, spec.color, spec.opts);
    else if (spec.type === 'empty') inner = '';
    else if (Array.isArray(spec.cells)) {
      /* matrice 2x2 explicite */
      inner = '<div class="mat">' + spec.cells.map(cs => '<i>' + (cs ? (cs.type === 'shape' ? shape(cs.kind, cs.color) : (cs.type === 'digit' ? digitSVG(cs.v, cs.color) : '')) : '') + '</i>').join('') + '</div>';
    }
    return '<div class="' + cls + '">' + inner + '</div>';
  }

  return { rng, int, pick, shuffle, sample, hash, pct, ms, num, esc, fr, dayKey, daysBetween,
           store, $, $$, el, frag, toast, modal, closeModal, beep,
           shape, svg, digitSVG, tile, C, PALETTE };
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   banks.js — Banques d'items FIXES (réplique de forme)
   Contenu : Verbal reasoning (EN) · Déductif · Comportement pro ·
             Motivation · Raisonnement mécanique
   ⚠ Toutes les banques de ce fichier sont "limitées" : contenu
     stable, identique à chaque session, aucune régénération.
   ═══════════════════════════════════════════════════════════════ */
'use strict';

const BANK = (() => {

  /* ══════════════════ 1. VERBAL REASONING (anglais) ══════════════════
     Format cut-e/SHL : un passage, 3 affirmations, Vrai / Faux / Impossible à dire.
     Règle stricte : on ne répond QUE sur la base du passage.
     « True »  = l'affirmation découle du texte.
     « False » = l'affirmation contredit le texte.
     « Cannot say » = le texte ne permet pas de trancher (info absente). */
  const T = 'true', F = 'false', CS = 'cannot say';

  const verbal = [
    {
      id: 'V01', theme: 'Corporate banking',
      passage: 'Meridian Bank reported that its corporate lending division grew its loan book by 9% in 2025, driven mainly by mid-sized manufacturers in northern Europe. The bank stated that demand for long-term credit facilities remained steady, but that many clients were increasingly requesting sustainability-linked covenants. Meridian expects the division to grow more slowly in 2026 because several large facilities will mature in the first half of the year.',
      q: [
        { s: 'Meridian Bank lends to mid-sized manufacturers.', a: T, w: 'Le texte précise que la croissance du portefeuille est portée principalement par les fabricants de taille moyenne.' },
        { s: 'Meridian Bank is the largest corporate lender in Europe.', a: CS, w: 'Aucune comparaison avec d’autres banques n’est faite.' },
        { s: 'Meridian Bank expects its corporate lending division to shrink in 2026.', a: F, w: 'Le texte annonce une croissance plus lente, pas une contraction.' }
      ]
    },
    {
      id: 'V02', theme: 'Market structure',
      passage: 'The share of European equity trading executed on exchanges declined last year, while trading on multilateral trading facilities and systematic internalisers increased. Regulators noted that this shift has made consolidated market data harder to assemble and more expensive. Market participants have argued that the fragmentation improves execution speed, although they acknowledge that the total cost of trading has not fallen for all investor categories.',
      q: [
        { s: 'Trading on multilateral trading facilities increased last year.', a: T, w: 'Stated explicitly.' },
        { s: 'Fragmentation has reduced the total cost of trading for all investors.', a: F, w: 'Le texte dit explicitement que le coût total n’a pas baissé pour toutes les catégories.' },
        { s: 'Regulators consider fragmented trading to be harmful overall.', a: CS, w: 'Ils constatent une difficulté technique sur les données ; aucun jugement global n’est donné.' }
      ]
    },
    {
      id: 'V03', theme: 'Central banks',
      passage: 'The central bank left its policy rate unchanged for the third consecutive meeting, citing persistent service-sector inflation. Two members of the committee voted for an increase. The governor stated that future decisions would depend on wage data and on the pace of disinflation, and declined to give any indication about the timing of a first cut.',
      q: [
        { s: 'The decision to hold rates was unanimous.', a: F, w: 'Deux membres ont voté pour une hausse.' },
        { s: 'The governor indicated when the first rate cut might occur.', a: F, w: 'Il a refusé de donner toute indication de calendrier.' },
        { s: 'Wage data will influence future decisions.', a: T, w: 'Le gouverneur le dit explicitement.' }
      ]
    },
    {
      id: 'V04', theme: 'Private equity',
      passage: 'A private equity fund closed its fifth vehicle at €4.1 billion, exceeding its €3.5 billion target. The fund focuses on healthcare and software businesses in Western Europe. Its previous fund delivered a gross multiple of 2.3x. The fund manager said that exit conditions had improved, but that entry valuations remained demanding, particularly for software assets.',
      q: [
        { s: 'The fund exceeded its fundraising target.', a: T, w: '4,1 Md€ > 3,5 Md€.' },
        { s: 'The previous fund returned a net multiple of 2.3x.', a: CS, w: 'Le multiple de 2,3x est indiqué comme BRUT ; le net n’est pas donné.' },
        { s: 'The fund invests mainly in industrial businesses.', a: F, w: 'Le texte parle de santé et de logiciels.' }
      ]
    },
    {
      id: 'V05', theme: 'FX',
      passage: 'The euro weakened against the dollar after the release of weaker-than-expected industrial production figures. Analysts attributed part of the move to position unwinding ahead of the year-end. Options market pricing suggested that investors were paying more for protection against further euro weakness, although realised volatility remained below its five-year average.',
      q: [
        { s: 'Industrial production figures were weaker than expected.', a: T, w: 'Stated explicitly.' },
        { s: 'Realised volatility was above its five-year average.', a: F, w: 'Le texte dit « below ».' },
        { s: 'The euro weakened against all major currencies.', a: CS, w: 'Seul le dollar est mentionné.' }
      ]
    },
    {
      id: 'V06', theme: 'ESG regulation',
      passage: 'The new disclosure standard requires asset managers to report the proportion of portfolio companies with validated emissions targets. Smaller managers have complained about the administrative burden, and the regulator has granted a two-year transition period for firms managing less than €5 billion. The standard applies to equity and corporate bond portfolios alike.',
      q: [
        { s: 'Smaller managers will have more time to comply.', a: T, w: 'Période transitoire de deux ans sous 5 Md€.' },
        { s: 'The standard applies only to equity portfolios.', a: F, w: 'Elle couvre aussi les obligations d’entreprise.' },
        { s: 'The regulator expects the administrative burden to raise fund fees.', a: CS, w: 'Aucune mention des frais.' }
      ]
    },
    {
      id: 'V07', theme: 'Fixed income',
      passage: 'The issuer priced a ten-year bond at a spread of 135 basis points over the reference rate, 15 basis points tighter than initial guidance. The order book reached €6 billion, allowing the issuer to increase the deal size from €750 million to €1 billion. The bonds were allocated predominantly to asset managers, with banks receiving a smaller share than in the previous transaction.',
      q: [
        { s: 'The final spread was tighter than the initial guidance.', a: T, w: '135 bp contre 150 bp de guidance initiale.' },
        { s: 'The order book was oversubscribed.', a: T, w: '6 Md€ de demandes pour 1 Md€ émis.' },
        { s: 'Banks received a larger allocation than in the previous transaction.', a: F, w: 'Le texte indique une part plus faible.' }
      ]
    },
    {
      id: 'V08', theme: 'Technology & trading',
      passage: 'A trading venue announced that it would reduce its latency by migrating to a new data centre. The migration will occur over a weekend to limit disruption, and members will be required to certify their connectivity before the change. The venue said that fees would remain unchanged for at least twelve months.',
      q: [
        { s: 'Members must certify connectivity before the migration.', a: T, w: 'Stated explicitly.' },
        { s: 'The migration will take place during a trading day.', a: F, w: 'Elle aura lieu un week-end.' },
        { s: 'The venue will attract more members after the migration.', a: CS, w: 'Aucune projection sur le nombre de membres.' }
      ]
    },
    {
      id: 'V09', theme: 'Equity research',

        const seed = U.hash(sc.id + '#' + qi);
        /* distracteurs spécifiques si fournis, sinon dérivés */
        let opt;
        if (typeof correct === 'string') {
          opt = { options: U.shuffle(U.rng(seed), [correct, ...q.dist(dd, correct)]), ans: 0 };
          opt.ans = opt.options.indexOf(correct);
        } else {
          const ds = q.dist(dd, correct) || [];
          opt = buildOpts(seed, correct, ds, q.fmt || nf);
        }
        items.push({
          id: sc.id + '.' + (qi + 1), sec: 'numerical',
          scenario: sc.title, unit: sc.unit, cols: sc.cols, rows: sc.rows,
          q: q.t(dd), options: opt.options, ans: opt.ans,
          why: 'Calcul direct sur le tableau « ' + sc.title + ' ».',
          time: 75
        });
      });
    });
    return items;   /* 8 scénarios × 6 = 48 items */
  }

     B. VERBAL ANGLAIS — banque ILLIMITÉE (conjecture d'une suite)
     Moteur : scénarios + faits → 3 affirmations dont les réponses
     sont dérivables du texte (T/F/CS), jamais ambiguës.
     ══════════════════════════════════════════════════════════════ */

     compteurs, périodes) sont tirées au sort, donc la batterie est infinie.
     Invariant garanti : 1 affirmation VRAIE, 1 FAUSSE, 1 IMPOSSIBLE À DIRE. */
  function VGEN(r) {
    const p1 = U.int(r, 6, 28), p2 = p1 + U.int(r, 2, 14);
    const m1 = U.int(r, 12, 90) * 10, m2 = m1 + U.int(r, 3, 40) * 5;
    const n1 = U.int(r, 3, 48), n2 = n1 + U.int(r, 1, 22);
    const d1 = (U.int(r, 22, 48) / 10), d2 = (U.int(r, 8, 21) / 10);
    return {
      p1, p2, p3: U.int(r, 3, 22), p0: U.int(r, 1, 12),
      m1, m2, n1, n2, d1: d1.toFixed(1).replace('.', ','), d2: d2.toFixed(1).replace('.', ','),
      period: U.pick(r, ['the fourth quarter', 'the first half of the year', 'the past twelve months',

      month: U.pick(r, ['January', 'March', 'June', 'September', 'November']),
      city: U.pick(r, ['Lyon', 'Rotterdam', 'Milan', 'Hamburg', 'Leeds', 'Valencia', 'Antwerp']),
      ratio: U.pick(r, ['two to one', 'three to one', 'four to one', 'five to one'])
    };
  }

  /** Génère un item verbal (passage + 3 affirmations V/F/CS) + justification. */
  function verbalItem(seed) {
    const r = U.rng(seed);
    const V = VGEN(r);
    const bp = U.pick(r, VB_BLUEPRINTS);
    const built = bp.build(V);
    const all = built.S;
    const trues = all.filter(x => x.a === 'true');
    const falses = all.filter(x => x.a === 'false');
    const css = all.filter(x => x.a === 'cannot say');
    const chosen = [];
    if (trues.length) chosen.push(U.pick(r, trues));
    if (falses.length) chosen.push(U.pick(r, falses));
    if (css.length) chosen.push(U.pick(r, css));
    while (chosen.length < 3) chosen.push(U.pick(r, all));
    const q = U.shuffle(r, chosen);
    return {
      id: 'VI' + (seed % 100000).toString(36).toUpperCase(), sec: 'verbalX',
      passage: built.passage, q, theme: bp.name, seed
    };
  }

  /* ══════════════════════════════════════════════════════════════
     C. INDUCTIF — séries de figures (banque limitée, seed fixe)
     ══════════════════════════════════════════════════════════════ */
  const SHAPES = ['circle', 'square', 'tri-up', 'tri-down', 'diamond', 'cross', 'star', 'plus', 'disc', 'square-rot', 'chev-up', 'dot-ring'];
  const ROT_MAP = { 'circle': 'circle', 'square': 'square', 'tri-up': 'tri-right', 'tri-down': 'tri-left', 'diamond': 'diamond', 'cross': 'plus', 'star': 'star', 'plus': 'cross', 'disc': 'dot-ring', 'square-rot': 'square-half', 'chev-up': 'chev-down', 'dot-ring': 'disc' };

  function inductiveSet(n = 30) {
    const items = [];
    for (let i = 0; i < n; i++) {
      const r = U.rng(1000 + i * 7);
      const sh = U.pick(r, SHAPES);
      const col = U.pick(r, ['grn', 'amb', 'blu', 'pur', 'teal', 'red']);
      const ruleKind = i % 5;
      const series = [];
      let opts;
      if (ruleKind === 0) {           /* rotation de la forme */
        series.push(sh, ROT_MAP[sh], sh, ROT_MAP[sh], sh);
        opts = [ROT_MAP[sh], sh, U.pick(r, SHAPES)].filter((v, idx, a) => a.indexOf(v) === idx);
        while (opts.length < 3) opts.push(U.pick(r, SHAPES));
        opts = U.shuffle(r, opts.slice(0, 3));
      } else if (ruleKind === 1) {    /* nombre croissant de points */
        series.push('dot-1', 'dot-2', 'dot-3', 'dot-1', 'dot-2');
        opts = ['dot-3', 'dot-1', 'dot-ring'];
        opts = U.shuffle(U.rng(1000 + i * 13), opts);
      } else if (ruleKind === 2) {    /* alternance plein / vide */
        series.push('disc', 'circle', 'disc', 'circle', 'disc');
        opts = U.shuffle(U.rng(1000 + i * 17), ['circle', 'disc', 'square-full']);
      } else if (ruleKind === 3) {    /* taille/motif croissant */
        series.push('chev-up', 'chev-up', 'plus', 'chev-up', 'chev-up');
        opts = U.shuffle(U.rng(1000 + i * 19), ['plus', 'cross', 'chev-down']);
      } else {                        /* figure tournante */
        series.push('tri-up', 'tri-right', 'tri-down', 'tri-left', 'tri-up');
        opts = U.shuffle(U.rng(1000 + i * 23), ['tri-right', 'tri-down', 'tri-left']);
      }
      let correct = { 0: ROT_MAP[sh], 1: 'dot-3', 2: 'circle', 3: 'plus', 4: 'tri-right' }[ruleKind];
      if (ruleKind === 2) correct = series[4] === 'disc' ? 'circle' : 'disc';
      items.push({
        id: 'IND' + (i + 1), sec: 'inductive', series, opts, color: col, ans: opts.indexOf(correct),
        why: ['La forme alterne entre deux états qui se succèdent.',
          'Le nombre de points augmente puis recommence.',
          'L’état plein et l’état vide alternent.',
          'Le motif change toutes les trois cases et revient.',
          'La forme tourne d’un quart de tour vers la droite.'][ruleKind],
        time: 30
      });
    }
    return items;
  }

  /* ══════════════════════════════════════════════════════════════
     D. CONCENTRATION — paires de figures : identiques ou différentes
     ══════════════════════════════════════════════════════════════ */
  function concentrationSet(n = 60) {
    const items = [];
    const base = ['circle', 'square', 'tri-up', 'diamond', 'star', 'plus', 'cross', 'dot-ring', 'square-half', 'chev-up', 'disc', 'square-rot'];
    const variants = {
      'circle': ['disc', 'dot-ring'], 'square': ['square-rot', 'square-half'], 'tri-up': ['tri-down', 'tri-left'],
      'diamond': ['square-rot', 'tri-up'], 'star': ['plus', 'cross'], 'plus': ['cross', 'star'],
      'cross': ['plus', 'star'], 'dot-ring': ['disc', 'circle'], 'square-half': ['square-full', 'square'],
      'chev-up': ['chev-down', 'tri-up'], 'disc': ['circle', 'dot-ring'], 'square-rot': ['square', 'diamond']
    };
    for (let i = 0; i < n; i++) {
      const r = U.rng(5000 + i * 31);
      const k = U.pick(r, base);
      const col = U.pick(r, ['grn', 'amb', 'blu', 'pur', 'teal', 'red', 'ink']);
      const same = r() < 0.5;
      const k2 = same ? k : U.pick(r, variants[k]);
      /* variation de rotation/couleur uniquement si différent */
      const col2 = same ? col : (r() < 0.45 ? U.pick(r, ['grn', 'amb', 'blu', 'pur', 'teal', 'red', 'ink'].filter(c => c !== col)) : col);
      items.push({
        id: 'CON' + (i + 1), sec: 'concentration',
        left: { kind: k, color: col }, right: { kind: (same && col2 === col) ? k : k2, color: col2 },
        same: (same && col2 === col), time: 2500
      });
    }
    return items;
  }

  /* ══════════════════════════════════════════════════════════════
     E. LEARNING EFFICIENCY — grille 5×5, 5 cases clignotantes
     ══════════════════════════════════════════════════════════════ */
  function learningSet(n = 20) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const r = U.rng(9000 + i * 41);
      const N = 5, cells = [];
      while (cells.length < 5) { const c = U.int(r, 0, 24); if (!cells.includes(c)) cells.push(c); }
      const color = ['grn', 'blu', 'amb', 'pur', 'teal'][i % 5];
      out.push({
        id: 'LEA' + (i + 1), sec: 'learning', size: N, cells, color,
        /* temps d'affichage adaptatif : diminue par palier (entraînement à la vitesse) */
        show: [9000, 8000, 7000, 6000, 5000][Math.min(4, Math.floor(i / 4))],
        time: 60
      });
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════════
     F. SWITCH CHALLENGE — retrouver la suite d'échanges appliquée
     ══════════════════════════════════════════════════════════════ */
  const SWAP_GLYPH = (a, b) => '⇄ ' + (a + 1) + '·' + (b + 1);

  function applyPerm(arr, perm) { return perm.map(i => arr[i]); }

  function switchSet(n = 30) {
    const items = [];
    const SWAPS = [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 3]];
    for (let i = 0; i < n; i++) {
      const r = U.rng(13000 + i * 53);
      const input = U.shuffle(r, [1, 2, 3, 4]);
      /* on construit une séquence valide de 1 à 3 échanges */
      const nSwaps = 1 + Math.floor(i / 10);
      const chosen = [];
      let perm = [0, 1, 2, 3];
      for (let s = 0; s < nSwaps; s++) {
        const sw = U.pick(r, SWAPS);
        chosen.push(sw);
        const p = [0, 1, 2, 3]; const t = p[sw[0]]; p[sw[0]] = p[sw[1]]; p[sw[1]] = t;
        perm = applyPerm(perm, p);
      }
      /* éviter la permutation identité (énoncé trivial) */
      if (perm.every((v, idx) => v === idx)) {
        const sw = U.pick(r, SWAPS);
        chosen.push(sw);
        const p = [0, 1, 2, 3]; const t = p[sw[0]]; p[sw[0]] = p[sw[1]]; p[sw[1]] = t;
        perm = applyPerm(perm, p);
      }
      const output = applyPerm(input, perm);
      /* options : la bonne (les échanges choisis) + 3 leurres dont la composition ≠ perm */
      const key = (arr) => arr.map(s => s.join('-')).join('|');
      const opts = [{ swaps: chosen, ok: true }];
      let guard = 0;
      while (opts.length < 4 && guard < 200) {
        guard++;
        const cand = [];
        let cp = [0, 1, 2, 3];
        const k = nSwaps === 1 ? 1 : (r() < 0.5 ? 1 : 2);
        for (let s = 0; s < k; s++) {
          const sw = U.pick(r, SWAPS);
          cand.push(sw);
          const p = [0, 1, 2, 3]; const t = p[sw[0]]; p[sw[0]] = p[sw[1]]; p[sw[1]] = t;
          cp = applyPerm(cp, p);
        }
        if (key(cand) === key(chosen)) continue;
        if (cp.join() === perm.join()) continue;   /* composition identique → on écarte */
        if (opts.some(o => key(o.swaps) === key(cand))) continue;
        opts.push({ swaps: cand, ok: false });
      }
      const sh = U.shuffle(r, opts);
      items.push({
        id: 'SW' + (i + 1), sec: 'switch', input, output,
        options: sh.map(o => ({ label: o.swaps.map(s => SWAP_GLYPH(s[0], s[1])).join('  '), swaps: o.swaps })),
        ans: sh.findIndex(o => o.ok),
        why: 'La bonne option reproduit exactement la permutation observée.',
        time: nSwaps === 1 ? 25 : (nSwaps === 2 ? 35 : 45)
      });
    }
    return items;
  }

  /* ══════════════════════════════════════════════════════════════
     G. MÉMOIRE DE TRAVAIL — grille, cases colorées à mémoriser
     ══════════════════════════════════════════════════════════════ */
  function memorySet(n = 15) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const r = U.rng(21000 + i * 67);
      const size = 5, k = 4 + (i % 2);
      const cells = [];
      while (cells.length < k) { const c = U.int(r, 0, size * size - 1); if (!cells.includes(c)) cells.push(c); }
      out.push({ id: 'MEM' + (i + 1), sec: 'memory', size, cells, show: 3000, time: 45 });
    }
    return out;
  }

  /* ══════════════════════════════════════════════════════════════
     H. RAISONNEMENT MÉCANIQUE — scènes SVG paramétriques
     ══════════════════════════════════════════════════════════════ */
  function mechScene(kind) {
    const c = '#9aa7b8', hl = '#2ecc8f', amb = '#e3b341';
    const gear = (cx, cy, r, col, label) =>
      '<g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + (col || c) + '" stroke-width="4"/>' +
      Array.from({ length: 10 }, (_, i) => {
        const a = i * 36 * Math.PI / 180;
        return '<rect x="' + (cx + (r + 4) * Math.cos(a) - 4) + '" y="' + (cy + (r + 4) * Math.sin(a) - 4) + '" width="8" height="8" fill="' + (col || c) + '"/>';
      }).join('') +
      '<text x="' + cx + '" y="' + (cy + 5) + '" font-size="16" font-weight="800" fill="' + (col || c) + '" text-anchor="middle" font-family="Inter">' + label + '</text></g>';
    const pulley = (cx, cy, r, col, label) =>
      '<g><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + (col || c) + '" stroke-width="4"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="' + (col || c) + '"/>' +
      '<text x="' + cx + '" y="' + (cy + 5) + '" font-size="15" font-weight="800" fill="' + (col || c) + '" text-anchor="middle" font-family="Inter">' + label + '</text></g>';
    const line = (x1, y1, x2, y2) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="3" stroke-dasharray="7 5"/>';
    switch (kind) {
      case 'gears2': return '<svg viewBox="0 0 420 200">' + gear(120, 100, 52, hl, 'A') + gear(240, 100, 52, amb, 'B') + '</svg>';
      case 'gears3': return '<svg viewBox="0 0 420 200">' + gear(90, 100, 42, hl, 'A') + gear(200, 100, 42, amb, 'B') + gear(310, 100, 42, c, 'C') + '</svg>';
      case 'gears4': return '<svg viewBox="0 0 520 200">' + gear(80, 100, 36, hl, 'A') + gear(190, 100, 36, amb, 'B') + gear(300, 100, 36, c, 'C') + gear(410, 100, 36, c, 'D') + '</svg>';
      case 'gears2size': return '<svg viewBox="0 0 460 200">' + gear(110, 100, 34, hl, 'A') + gear(300, 100, 74, amb, 'B') + '</svg>';
      case 'belt': return '<svg viewBox="0 0 440 220">' + pulley(120, 110, 62, hl, 'A') + pulley(320, 110, 62, amb, 'B') +
        '<path d="M120 48 L320 48 M120 172 L320 172" stroke="' + c + '" stroke-width="4"/>' + '</svg>';
      case 'beltcross': return '<svg viewBox="0 0 440 240">' + pulley(120, 120, 62, hl, 'A') + pulley(320, 120, 62, amb, 'B') +
        '<path d="M120 58 L320 182 M120 182 L320 58" stroke="' + c + '" stroke-width="4"/>' + '</svg>';
      case 'lever': return '<svg viewBox="0 0 480 200">' +
        '<path d="M40 150 L440 150" stroke="' + c + '" stroke-width="8"/>' +
        '<path d="M240 150 L240 190" stroke="' + amb + '" stroke-width="8"/>' +
        '<rect x="30" y="106" width="52" height="40" fill="' + hl + '" rx="4"/><text x="56" y="132" font-size="14" font-weight="800" fill="#04120d" text-anchor="middle">CH</text>' +
        '<path d="M420 150 L420 120" stroke="' + amb + '" stroke-width="6"/><path d="M410 128 L420 108 L430 128 Z" fill="' + amb + '"/>' +
        '<text x="240" y="188" font-size="13" fill="' + c + '" text-anchor="middle">pivot</text></svg>';
      case 'pulley1': return '<svg viewBox="0 0 320 240">' + pulley(160, 60, 46, hl, 'P') +
        '<line x1="160" y1="106" x2="160" y2="180" stroke="' + c + '" stroke-width="3"/>' +
        '<rect x="130" y="180" width="60" height="42" fill="' + amb + '" rx="4"/><text x="160" y="207" font-size="13" font-weight="800" fill="#1a1400" text-anchor="middle">Q</text></svg>';
      case 'pulley2': return '<svg viewBox="0 0 340 260">' + pulley(110, 50, 34, c, 'F') + pulley(210, 50, 34, c, 'F') +
        '<path d="M110 84 L110 190 M210 84 L210 190" stroke="' + c + '" stroke-width="3"/>' + '<rect x="120" y="190" width="80" height="46" fill="' + amb + '" rx="4"/>' +
        '<text x="160" y="220" font-size="13" font-weight="800" fill="#1a1400" text-anchor="middle">Q</text></svg>';
      case 'pulley3': return '<svg viewBox="0 0 400 260">' + pulley(90, 46, 30, c, 'F') + pulley(190, 46, 30, c, 'F') + pulley(290, 46, 30, c, 'F') +
        '<path d="M90 76 L90 190 M190 76 L190 190 M290 76 L290 190" stroke="' + c + '" stroke-width="3"/>' +
        '<rect x="120" y="190" width="140" height="46" fill="' + amb + '" rx="4"/><text x="190" y="220" font-size="13" font-weight="800" fill="#1a1400" text-anchor="middle">Q</text></svg>';
      case 'spring': return '<svg viewBox="0 0 300 240">' +
        '<path d="M60 40 L240 40" stroke="' + c + '" stroke-width="6"/>' +
        '<path d="M150 40 ' + Array.from({ length: 9 }, (_, i) => 'L' + (i % 2 ? 120 : 180) + ' ' + (52 + i * 12)).join(' ') + '" stroke="' + hl + '" stroke-width="4" fill="none"/>' +
        '<rect x="110" y="160" width="80" height="44" fill="' + amb + '" rx="4"/><text x="150" y="189" font-size="13" font-weight="800" fill="#1a1400" text-anchor="middle">Q</text></svg>';
      case 'axle': return '<svg viewBox="0 0 420 220">' + pulley(140, 110, 70, hl, 'G') + pulley(300, 110, 26, amb, 'P') +
        '<line x1="140" y1="110" x2="300" y2="110" stroke="' + c + '" stroke-width="4"/>' +
        '<text x="140" y="204" font-size="12" fill="' + c + '" text-anchor="middle">même axe</text></svg>';
      default: return '<svg viewBox="0 0 300 160">' + gear(150, 80, 48, hl, '·') + '</svg>';
    }
  }

  /* ══════════════════════════════════════════════════════════════
     I. Correspondance figure → rendu SVG (banque déductive)
     ══════════════════════════════════════════════════════════════ */
  const FIGMAP = {
    'circle': 'circle', 'square': 'square', 'triangle': 'tri-up', 'dot': 'dot-1',
    'd1': 'dot-1', 'd2': 'dot-2', 'd3': 'dot-3',
    'arr-r': 'arr-right', 'arr-l': 'arr-left', 'arr-u': 'arr-up', 'arr-d': 'arr-down',
    'full': 'disc', 'empty': 'circle', 'full2': 'dot-ring',
    'gp': 'plus', 'gm': 'cross', 'gh': 'star',
    'c-tl': 'circle', 's-t': 'square', 't-tr': 'tri-up', 't-r': 'tri-right', 'c-br': 'dot-ring', 's-b': 'square-half', 's-bl': 'square-rot', 't-l': 'tri-left', 's-br': 'square-full',
    'thin': 'circle', 'mid': 'dot-ring', 'thick': 'disc',
    'ht': 'half-top', 'hl': 'half-left', 'hb': 'half-top',
    'a': 'circle', 'b': 'square', 'ab': 'dot-ring',
    'fl': 'chev-up', 'fr': 'chev-down', 'f2': 'tri-down',
    'h1': 'diamond', 'h2': 'square-rot', 'h3': 'tri-left', 'h4': 'square-diag'
  };
  const COLORMAP = { grn: '#0a8a3c', amb: '#b58100', red: '#c62828', blu: '#1565c0', pur: '#5b3d8f', teal: '#0d6f78', ink: '#23282c', gray: '#5a656e' };

  /** Rend une case de la banque déductive (spec = {shape,color} ou clé). */
  function dedTile(spec, colKey, cls) {
    const kindKey = typeof spec === 'string' ? spec : spec.shape;
    const colK = typeof spec === 'string' ? colKey : spec.color;
    const kind = FIGMAP[kindKey] || 'square';
    const color = COLORMAP[colK] || COLORMAP.ink;
    const isQ = kindKey === '??' || spec === '??';
    return '<div class="sym ' + (cls || '') + (isQ ? ' unknown' : '') + '">' + (isQ ? '' : U.shape(kind, color)) + '</div>';
  }

  return { nf, money, pctS, numericalFixed, verbalItem, VB_BLUEPRINTS, inductiveSet, concentrationSet,
           learningSet, switchSet, memorySet, mechScene, dedTile, FIGMAP, COLORMAP, NUM_SCEN };
})();

</script>
<script>
/* ═══════════════════════════════════════════════════════════════
   numverb.js — Numerical Reasoning au format cut-e / Maki :
   6 sous-onglets de figures, 37 énoncés true / false / cannot say,
   12 minutes, bascule automatique vers l'onglet de la question.
   Les figures sont paramétriques (SVG généré) : jamais déformées.
   ═══════════════════════════════════════════════════════════════ */
'use strict';

const NUMVERB = (() => {
  const PAL = { 1: '#e08a1e', 2: '#1565c0', 3: '#0d6f78', 4: '#5b3d8f', 5: '#0a8a3c' };
  const INK = '#5a656e', LINE = '#cdd4da', GRID = '#e2e6ea';
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ── brique SVG ── */
  const svg = (w, h, inner) => '<svg class="nvsvg" viewBox="0 0 ' + w + ' ' + h + '" width="100%" ' +
    'preserveAspectRatio="xMidYMid meet" role="img">' + inner + '</svg>';
  const txt = (x, y, s, o) => {
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" font-size="' + (o.size || 11) + '" fill="' + (o.fill || INK) + '" ' +
      'text-anchor="' + (o.anchor || 'middle') + '"' + (o.bold ? ' font-weight="700"' : '') +
      (o.mono ? ' font-family="monospace"' : '') + '>' + esc(s) + '</text>';
  };
  /* légende : fragment SVG à insérer DANS un <svg> (sinon les <rect>/<text> ne sont pas rendus) */
  const legend = (items, y) => items.map((it, i) => {
    const x = 40 + (i % 3) * 200, yy = y + Math.floor(i / 3) * 22;
    return '<rect x="' + x + '" y="' + (yy - 10) + '" width="13" height="13" rx="2" fill="' + PAL[it.color] + '"/>' +
      txt(x + 6.5, yy, it.n, { size: 9, fill: '#fff', bold: true }) +
      txt(x + 20, yy, it.name, { size: 11, anchor: 'start', fill: '#23282c' });
  }).join('');
  const legendBox = (items, y, cols) => {
    cols = cols || 3;
    const rows = Math.ceil(items.length / cols), h = y + Math.ceil(items.length / cols) * 22;
    return '<svg class="nvlegsvg" width="620" height="' + h + '" viewBox="0 0 620 ' + h + '">' + legend(items, y) + '</svg>';
  };

  /* ── 1. tableau ── */
  function table(t) {
    const body = t.rows.map(r => '<tr' + (t.strong && t.strong.indexOf(r[0]) > -1 ? ' class="s"' : '') + '>' +
      '<td class="k">' + esc(r[0]) + '</td>' +
      r.slice(1).map(v => '<td class="n">' + esc(String(v).replace('-', ' -')) + '</td>').join('') + '</tr>').join('');
    return '<table class="nvtbl"><thead><tr>' + t.head.map((c, i) => '<th class="' + (i ? 'n' : 'k') + '">' + esc(c) + '</th>').join('') +
      '</tr></thead><tbody>' + body + '</tbody></table>' + (t.note ? '<div class="nvnote">' + esc(t.note) + '</div>' : '');
  }

  /* ── 2. camembert ── */
  function pie(d) {
    const cx = 190, cy = 150, r = 108;
    let a0 = -Math.PI / 2, inner = '';
    const S = d.slices;
    /* ordre visuel du test réel pour 4 parts ; tout autre nombre est rendu tel quel */
    const order = (S.length === 4) ? [S[1], S[3], S[0], S[2]] : S.slice();
    order.forEach(s => {
      const a1 = a0 + (s.pct / 100) * 2 * Math.PI;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      inner += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
        ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + PAL[s.color] +
        '" stroke="#fff" stroke-width="1.5"/>';
      const am = (a0 + a1) / 2, lx = cx + (r * 1.22) * Math.cos(am), ly = cy + (r * 1.22) * Math.sin(am);
      inner += txt(lx, ly + 4, s.pct + '%', { size: 12, bold: true, fill: '#23282c' });
      const bx = cx + (r * 0.62) * Math.cos(am), by = cy + (r * 0.62) * Math.sin(am);
      inner += '<rect x="' + (bx - 7) + '" y="' + (by - 7) + '" width="14" height="14" rx="2" fill="rgba(0,0,0,.25)"/>' +
        txt(bx, by + 4, s.color, { size: 10, fill: '#fff', bold: true });
      a0 = a1;
    });
    return svg(620, 300, inner) +
      '<div class="nvcap">' + esc(d.title) + '</div>' +
      '<div class="nvlegend">' + legendBox(d.slices.map(s => ({ color: s.color, n: s.color, name: s.label })), 16) + '</div>' +
      '<div class="nvnote">' + esc(d.total) + '</div>';
  }

  /* ── 3. colonnes empilées ── */
  function stacked(d) {
    const W = 640, H = 300, x0 = 70, x1 = 600, y0 = 34, y1 = 240, max = d.ymax;
    let g = '';
    for (let v = 0; v <= max; v += 10) {
      const y = y1 - (v / max) * (y1 - y0);
      g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="' + GRID + '"/>' +
        txt(x0 - 8, y + 4, v, { size: 10, anchor: 'end' });
    }
    const n = d.xlabels.length, gw = (x1 - x0) / n, bw = 46;
    d.xlabels.forEach((lab, i) => {
      const cx = x0 + gw * (i + 0.5);
      let acc = 0;
      d.series.forEach(s => {
        const v = s.values[i], h = (v / max) * (y1 - y0);
        const y = y1 - acc - h;
        g += '<rect x="' + (cx - bw / 2) + '" y="' + y.toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) +
          '" fill="' + PAL[s.color] + '" stroke="#fff" stroke-width="1"/>' +
          txt(cx, y + h / 2 + 3.5, v, { size: 9.5, fill: '#fff', bold: true });
        acc += h;
      });
      g += txt(cx, y1 + 16, lab, { size: 11, fill: '#23282c' });
    });
    g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '" stroke="' + LINE + '"/>';
    g += txt((x0 + x1) / 2, y1 + 36, d.xaxis, { size: 11, fill: '#23282c' });
    g += txt(16, (y0 + y1) / 2, d.yaxis.replace('\n', ' '), { size: 11, fill: '#23282c', anchor: 'middle' });
    return svg(W, H + 46, g) +
      '<div class="nvlegend">' + legendBox(d.series.map(s => ({ color: s.color, n: s.color, name: s.name })), 16) + '</div>';
  }

  /* ── 4. courbes ── */
  function lines(d) {
    const W = 640, H = 300, x0 = 70, x1 = 600, y0 = 34, y1 = 240, max = d.ymax;
    let g = '';
    for (let v = 0; v <= max + 1e-9; v += 0.5) {
      const y = y1 - (v / max) * (y1 - y0);
      g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y + '" y2="' + y + '" stroke="' + GRID + '"/>' +
        txt(x0 - 8, y + 4, v.toFixed(1), { size: 10, anchor: 'end' });
    }
    const n = d.xlabels.length, gw = (x1 - x0) / n;
    d.series.forEach(s => {
      const pts = s.values.map((v, i) => [x0 + gw * (i + 0.5), y1 - (v / max) * (y1 - y0)]);
      g += '<polyline points="' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') +
        '" fill="none" stroke="' + PAL[s.color] + '" stroke-width="2"/>';
      pts.forEach((p, i) => {
        g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + PAL[s.color] + '"/>' +
          txt(p[0], p[1] - 9, s.values[i].toFixed(2).replace(/0$/, '').replace(/\.$/, ''), { size: 10, fill: '#23282c' });
      });
    });
    d.xlabels.forEach((lab, i) => { g += txt(x0 + gw * (i + 0.5), y1 + 16, lab, { size: 11, fill: '#23282c' }); });
    g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + y1 + '" y2="' + y1 + '" stroke="' + LINE + '"/>';
    g += txt((x0 + x1) / 2, y1 + 36, d.xaxis, { size: 11, fill: '#23282c' });
    g += txt(16, (y0 + y1) / 2, d.yaxis, { size: 11, fill: '#23282c' });
    return svg(W, H + 46, g) +
      '<div class="nvlegend">' + legendBox(d.series.map(s => ({ color: s.color, n: s.color, name: s.name })), 16) + '</div>';
  }

  /* ── 5. barres horizontales ── */
  function hbars(d) {
    const W = 640, H = 300, x0 = 92, x1 = 600, y0 = 26, y1 = 236, max = d.xmax;
    let g = '';
    for (let v = 0; v <= max; v += 5) {
      const x = x0 + (v / max) * (x1 - x0);
      g += '<line x1="' + x + '" x2="' + x + '" y1="' + y0 + '" y2="' + y1 + '" stroke="' + GRID + '"/>' +
        txt(x, y1 + 18, v, { size: 10 });
    }
    const n = d.xlabels.length, gh = (y1 - y0) / n;
    d.xlabels.forEach((lab, i) => {
      const cy = y0 + gh * (i + 0.5);
      g += txt(x0 - 12, cy + 10, lab, { size: 11, anchor: 'end', fill: '#23282c' });
      d.series.forEach((s, k) => {
        const v = s.values[i], h = 15, y = cy - (d.series.length * (h + 4)) / 2 + k * (h + 4);
        const w = (v / max) * (x1 - x0);
