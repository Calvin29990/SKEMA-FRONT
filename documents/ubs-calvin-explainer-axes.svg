<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
<rect width="100%" height="100%" fill="#fff"/>
<text x="34" y="40" fill="#172433" font-family="Arial,sans-serif" font-size="23" font-weight="700">Lire les deux axes en 10 secondes</text>
<text x="34" y="64" fill="#5c6c7c" font-family="Arial,sans-serif" font-size="13">Le temps est horizontal ; chaque indicateur garde sa propre unité.</text>
<rect x="35" y="92" width="450" height="110" rx="10" fill="#eef5fc" stroke="#cbdced"/>
<text x="57" y="129" fill="#172433" font-family="Arial,sans-serif" font-size="18" font-weight="700">Axe gauche · P&amp;L</text>
<text x="57" y="160" fill="#5c6c7c" font-family="Arial,sans-serif" font-size="14">Résultat cumulé, en millions USD.</text>
<rect x="515" y="92" width="450" height="110" rx="10" fill="#fff5e9" stroke="#efdbc2"/>
<text x="537" y="129" fill="#172433" font-family="Arial,sans-serif" font-size="18" font-weight="700">Axe droit · exposition</text>
<text x="537" y="160" fill="#5c6c7c" font-family="Arial,sans-serif" font-size="14">Risque pris, en % de la limite.</text>
<text x="500" y="235" text-anchor="middle" fill="#37485a" font-family="Arial,sans-serif" font-size="12">Comparer l’évolution dans le temps, pas la hauteur des lignes entre deux axes.</text>
</svg>