name: Deploy AmplifyME trainer to GitHub Pages

on:
  push:
    branches:
      - arena/a9eba1d0-skema-front
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (création du site si nécessaire)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site (amplifyme-training)
        uses: actions/upload-pages-artifact@v3
        with:
          path: amplifyme-training

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
