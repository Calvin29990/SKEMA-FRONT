 {title:'Priorities & preferences',short:'Priorities',icon:'⇄',time:'5–6 min',desc:'Choose the statement that is more like you and the one that is less like you. There are no “ideal-person” answers here; the exercise is to make genuine trade-offs.'},

['When a market brief is due soon, I naturally…','Check key facts and risks before sending','Prefer to share an early draft and refine it with feedback','Focus on the main decision and keep the message concise'],

const scenarios=[
 {situation:'A desk colleague asks you to send a client-facing market note immediately. You notice that one key figure conflicts with the source data, but the deadline is close.',options:['Send it now and assume the difference is immaterial.','Quickly verify the figure, flag the delay, and send a corrected note with the relevant caveat.','Delete the disputed figure without telling anyone.','Ask the colleague to decide, without sharing what you noticed.'],best:1,worst:0,why:'Protect accuracy, raise the issue promptly, and communicate the impact. Speed matters, but an unverified client-facing number can create avoidable risk.'},
 {situation:'A senior asks for a short view on a sudden market move. You have a plausible explanation, but one important source has not yet confirmed it.',options:['Present the explanation as certain so the senior can act quickly.','State what is confirmed, label the hypothesis, and say what you are checking next.','Wait silently until every possible source agrees.','Forward an unverified social-media post as supporting evidence.'],best:1,worst:0,why:'Separate fact from hypothesis, be concise about uncertainty, and continue verification. Do not overstate confidence or pass on unverified information.'},
 {situation:'You discover that a spreadsheet you sent internally contains an error that could change a recommendation. No one has raised it yet.',options:['Notify the relevant colleague promptly, explain the impact, and send a corrected version.','Quietly replace the file and hope nobody used the earlier version.','Wait to see whether anyone notices.','Blame the source data in the group chat before checking the full chain.'],best:0,worst:2,why:'Own the error, establish who may have relied on it, and correct the record quickly. Quietly replacing a file can leave others using the wrong version.'},
 {situation:'Two tasks arrive together: a client update due shortly and a control check where you have spotted an unexplained exception.',options:['Ignore the exception until after the client update, without telling anyone.','Clarify relative urgency with the supervisor, flag the exception, and agree who covers each task.','Drop both tasks and wait for further instruction.','Finish whichever task is easier and do not update the team.'],best:1,worst:3,why:'Make the conflict visible, protect the control issue, and coordinate priorities. Silent reprioritisation creates avoidable operational risk.'},
 {situation:'A teammate challenges your analysis in a meeting. You believe your conclusion is right, but their evidence raises a point you had not considered.',options:['Ask them to walk through the evidence, then test whether it changes your conclusion.','Repeat your conclusion more forcefully to end the disagreement.','Dismiss the point because the teammate is junior.','Agree immediately without checking the evidence.'],best:0,worst:2,why:'Be open to challenge without abandoning independent judgement. Evaluate evidence on its merits and keep the discussion respectful.'},
 {situation:'You are asked to share a client detail in a broad team channel to speed up a discussion. You are unsure whether everyone in the channel is authorised to see it.',options:['Share it because the team is internal.','Check the approved audience or use an authorised channel before sharing.','Post it and delete it later if someone objects.','Send it to a personal email so you can decide later.'],best:1,worst:3,why:'Treat confidentiality as a control requirement. Verify access before sharing and use approved systems.'}
];
const state={started:false,section:0,q:0,answers:{},submitted:false};
const STORE='plum-practice-v1';
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.answers)Object.assign(state,saved)}catch(e){}
const app=document.getElementById('app');
function persist(){localStorage.setItem(STORE,JSON.stringify(state));updateProgress()}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function updateProgress(){let done=Object.keys(state.answers).length;let total=8+5+3+5+6;let pct=state.submitted?100:Math.min(96,Math.round(done/total*100));document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressLabel').textContent=pct+'%';}
function nav(){const el=document.getElementById('sectionNav');el.innerHTML=sections.map((s,i)=>`<button class="${state.started&&state.section===i&&!state.submitted?'active':''} ${isSectionDone(i)?'done':''}" onclick="jump(${i})"><span class="nav-icon">${s.icon}</span><span class="nav-copy"><strong>${s.short}</strong><small>${s.time}</small></span><span class="nav-state">${isSectionDone(i)?'✓':''}</span></button>`).join('')}
function isSectionDone(i){return sections.map((_,n)=>sectionKeys(n)).flat().every(k=>state.answers[k]!==undefined)}
function sectionKeys(i){if(i===0)return prefs.map((_,n)=>`p${n}`);if(i===1)return puzzles1.map((_,n)=>`a${n}`);if(i===2)return descriptors.map((_,n)=>`d${n}`);if(i===3)return puzzles2.map((_,n)=>`b${n}`);return scenarios.map((_,n)=>`j${n}`)}
function startFresh(){state.started=true;state.submitted=false;state.section=0;state.q=0;state.answers={};persist();render()}
function intro(){app.innerHTML=`<div class="hero"><div class="hero-grid"><div><div class="eyebrow">Original practice experience</div><h1 class="heading">Get ready for the<br>Plum Profile format.</h1><p class="subheading">A realistic, role-aware warm-up for your Citi Markets — Sales & Trading Off-Cycle application. Work through preferences, pattern puzzles, descriptors and workplace judgement before you open the live assessment.</p><div class="stats"><div class="stat"><b>5 sections</b><span>Official format</span></div><div class="stat"><b>~25 min</b><span>Untimed practice</span></div><div class="stat"><b>Original items</b><span>Built for practice</span></div></div></div><div class="hero-visual"><div class="orbit"></div><div class="orbit two"></div><div class="profile-card"><div class="profile-head"><div class="profile-avatar">P</div><div><strong>Your work-style snapshot</strong><small>Practice reflection · not a hiring score</small></div></div><div class="talent-line"><span>Decision making</span><div class="bar"><i style="width:78%"></i></div></div><div class="talent-line"><span>Adaptation</span><div class="bar"><i style="width:66%"></i></div></div><div class="talent-line"><span>Teamwork</span><div class="bar"><i style="width:84%"></i></div></div><div class="hero-stat"><b>5</b>question formats</div></div></div></div></div>
<div class="notice"><strong>Important:</strong> This is an independent training simulator, not Citi or Plum software. Official Plum says the Discovery Survey is untimed, usually takes about 25 minutes, and covers personality choices, visual problem solving and workplace situations. This practice uses newly written questions and cannot reproduce Citi's private role-matching criteria.</div>
${state.started&&!state.submitted?`<div class="resume"><span>You have saved practice answers. Resume where you left off.</span><button class="btn small" onclick="resume()">Resume</button></div>`:''}
<div class="section-list">${sections.map((s,i)=>`<div class="section-tile"><div class="tile-icon">${s.icon}</div><div><strong>${i+1}. ${s.title}</strong><span>${s.time} · ${i===0?'forced choice':i===1||i===3?'pattern reasoning':i===2?'self-description':'workplace judgement'}</span></div></div>`).join('')}</div>
<div class="start-row"><button class="btn" onclick="startFresh()">${state.started?'Start a fresh practice':'Start practice'}</button><span class="micro">Use a laptop · no calculator or audio needed · answers save on this device</span>${state.started?'<button class="reset-link" onclick="clearProgress()">Clear saved answers</button>':''}</div>
<div class="disclaimer">Independent preparation resource. The Plum name is used only to identify the assessment format. No official questions, proprietary scoring, Citi branding or Plum interface assets are reproduced.</div>`;nav();updateProgress()}
function resume(){state.started=true;state.submitted=false;render()}
function clearProgress(){if(confirm('Clear all saved practice answers on this device?')){localStorage.removeItem(STORE);Object.assign(state,{started:false,section:0,q:0,answers:{},submitted:false});intro();nav();updateProgress()}}
function jump(i){if(!state.started)return;state.section=i;state.q=0;render()}
function render(){if(!state.started){intro();return} if(state.submitted){results();return}nav();updateProgress();if(state.section===0)renderPreference();else if(state.section===1)renderPuzzle(puzzles1,'a');else if(state.section===2)renderDescriptor();else if(state.section===3)renderPuzzle(puzzles2,'b');else renderScenario()}
function shell(i,sub,content,valid,prevLabel='Back',nextLabel='Continue'){let total=sectionKeys(i).length, qnum=state.q+1;return `<div class="panel-head"><div><span class="section-number"><span>${sections[i].icon}</span> SECTION ${i+1} OF 5</span><h2 class="section-title">${sections[i].title}</h2><p class="section-desc">${sections[i].desc}</p></div><div class="question-count">${sub?`Item ${qnum} of ${total}`:`${total} items`}</div></div>${content}<div class="footer-nav"><button class="btn secondary small" onclick="previous()">${prevLabel}</button><span class="middle">Your progress is saved on this device</span><button class="btn small" id="nextBtn" onclick="next()" ${valid?'':'disabled'}>${state.section===4&&state.q===total-1?'Review practice':qnum===total?'Next section':nextLabel}</button></div>`}
function renderPreference(){let i=state.q,item=prefs[i],key='p'+i,a=state.answers[key]||{};let content=`<div class="question-card"><div class="question-label">Priorities & preferences · ${i+1}</div><p class="question-prompt">${item[0]}</p><div class="helper">Choose one statement as <b>most like you</b> and a different one as <b>least like you</b>.</div><div class="choice-head"><span>Statement</span><span>Most</span><span>Least</span></div>${item.slice(1).map((text,n)=>`<div class="choice-row"><div class="choice-text">${text}</div><button class="radio-choice ${a.most===n?'selected most':''}" aria-label="Most like me" onclick="setPreference(${i},${n},'most')">MOST</button><button class="radio-choice ${a.least===n?'selected least':''}" aria-label="Least like me" onclick="setPreference(${i},${n},'least')">LEAST</button></div>`).join('')}</div><div class="answer-note"><strong>Practice cue:</strong> this is a forced-choice reflection, not a search for the most impressive-sounding statement. Think about your usual behaviour, not a perfect day.</div>`;app.innerHTML=shell(0,i,content,a.most!==undefined&&a.least!==undefined)}
function setPreference(i,n,which){let key='p'+i;let a=state.answers[key]||{};if(a[which]===n)delete a[which];else{a[which]=n;if(a[which==='most'?'least':'most']===n)delete a[which==='most'?'least':'most']}state.answers[key]=a;persist();renderPreference()}
function renderDescriptor(){let i=state.q,item=descriptors[i],key='d'+i,a=state.answers[key]||{top:[],low:[]};let content=`<div class="question-card"><div class="question-label">Work-style descriptors · ${item.label}</div><p class="question-prompt">Which words feel most and least natural in your working style?</p><p class="helper">Select <b>3 most like you</b> and <b>3 least like you</b>. Tap a word again to clear it. A word cannot be in both groups.</p><div class="rank-legend"><span><i class="dotkey"></i>Most like me: ${a.top.length}/3</span><span><i class="dotkey low"></i>Least like me: ${a.low.length}/3</span></div><div class="multi-select">${item.words.map((w,n)=>{let c=a.top.includes(n)?'top':a.low.includes(n)?'low':'';return `<div class="trait-chip ${c}"><strong>${w}</strong><span class="tag">${c==='top'?'MOST LIKE ME':c==='low'?'LEAST LIKE ME':'CHOOSE'}</span><div class="trait-actions"><button class="trait-pick ${a.top.includes(n)?'on-top':''}" onclick="toggleTrait(${i},${n},'top')" ${!a.top.includes(n)&&a.top.length>=3?'disabled':''}>Most</button><button class="trait-pick ${a.low.includes(n)?'on-low':''}" onclick="toggleTrait(${i},${n},'low')" ${!a.low.includes(n)&&a.low.length>=3?'disabled':''}>Least</button></div></div>`}).join('')}</div></div><div class="answer-note"><strong>Reflection:</strong> being “least like me” is a relative choice within this set; it does not mean you lack that quality.</div>`;app.innerHTML=shell(2,i,content,a.top.length===3&&a.low.length===3)}
function toggleTrait(i,n,which){let k='d'+i,a=state.answers[k]||{top:[],low:[]},other=which==='top'?'low':'top';if(a[which].includes(n))a[which]=a[which].filter(x=>x!==n);else if(a[which].length<3){a[other]=a[other].filter(x=>x!==n);a[which].push(n)}else toast(`You have already chosen 3 ${which==='top'?'most':'least'} traits.`);state.answers[k]=a;persist();renderDescriptor()}
function drawPuzzle(item){if(item.kind==='sequence')return `<div class="pattern-display"><div class="pattern-seq">${item.seq.map((s,n)=>`<span class="symbol ${s==='?'?'missing':''}">${s}</span>${n<item.seq.length-1?'<span class="pattern-arrow">›</span>':''}`).join('')}</div></div>`;return `<div class="pattern-display"><div class="matrix">${item.matrix.map(s=>`<span class="matrix-cell ${s==='?'?'missing':''}">${s}</span>`).join('')}</div></div>`}
function renderPuzzle(bank,prefix){let i=state.q,item=bank[i],key=prefix+i,chosen=state.answers[key],content=`<div class="question-card"><div class="question-label">Pattern reasoning · ${prefix==='a'?'Set 1':'Set 2'} · ${i+1}</div><p class="question-prompt">${item.prompt}</p>${drawPuzzle(item)}<div class="option-grid">${item.opts.map((o,n)=>`<button class="option-card ${chosen?.choice===n?'selected':''}" onclick="choosePuzzle('${prefix}',${i},${n})"><span class="option-letter">${String.fromCharCode(65+n)}</span><span class="option-text">${o}</span></button>`).join('')}</div>${chosen?`<div class="answer-note"><strong>${chosen.choice===item.ans?'Correct.':'Not this time.'}</strong> ${item.why}</div>`:''}</div>`;app.innerHTML=shell(state.section,i,content,chosen!==undefined)}
function choosePuzzle(prefix,i,n){state.answers[prefix+i]={choice:n};persist();render()}
function renderScenario(){let i=state.q,item=scenarios[i],key='j'+i,a=state.answers[key]||{};let content=`<div class="question-card"><div class="question-label">Markets workplace judgement · scenario ${i+1}</div><p class="question-prompt">${item.situation}</p><p class="helper">Select one <b>most effective</b> and one <b>least effective</b> response. They must be different.</p><div class="scenario-options">${item.options.map((o,n)=>`<div class="scenario-option"><p>${o}</p><button class="pick-btn ${a.best===n?'active-best':''}" onclick="setScenario(${i},${n},'best')">MOST</button><button class="pick-btn ${a.worst===n?'active-worst':''}" onclick="setScenario(${i},${n},'worst')">LEAST</button></div>`).join('')}</div>${a.best!==undefined&&a.worst!==undefined?`<div class="answer-note"><strong>Debrief:</strong> ${item.why}</div>`:''}</div>`;app.innerHTML=shell(4,i,content,a.best!==undefined&&a.worst!==undefined)}
function setScenario(i,n,which){let k='j'+i,a=state.answers[k]||{};if(a[which]===n)delete a[which];else{a[which]=n;if(a[which==='best'?'worst':'best']===n)delete a[which==='best'?'worst':'best']}state.answers[k]=a;persist();renderScenario()}
function previous(){if(state.q>0)state.q--;else if(state.section>0){state.section--;state.q=sectionKeys(state.section).length-1}else{state.started=false;intro();return}render()}
function next(){if(state.section===4&&state.q===scenarios.length-1){state.submitted=true;persist();render();return}if(state.q<sectionKeys(state.section).length-1)state.q++;else{state.section=Math.min(4,state.section+1);state.q=0}render()}
function results(){nav();updateProgress();let pscore=[...puzzles1.map((_,i)=>state.answers['a'+i]?.choice===puzzles1[i].ans),...puzzles2.map((_,i)=>state.answers['b'+i]?.choice===puzzles2[i].ans)].filter(Boolean).length;let js= scenarios.map((s,i)=>{let a=state.answers['j'+i]||{};return a.best===s.best&&a.worst===s.worst}).filter(Boolean).length;let topWords=[],lowWords=[];descriptors.forEach((d,i)=>{let a=state.answers['d'+i]||{top:[],low:[]};a.top.forEach(n=>topWords.push(d.words[n]));a.low.forEach(n=>lowWords.push(d.words[n]))});let allDone=sections.map((_,i)=>sectionKeys(i)).flat().every(k=>state.answers[k]!==undefined);app.innerHTML=`<div class="finish-card"><div class="eyebrow">Practice debrief</div><h1 class="heading">Your run is complete.</h1><p class="subheading">Use this review to spot format surprises and sharpen your approach. It is not a Plum score, Citi Match Score or hiring prediction.</p><div class="score-grid"><div class="score-box"><b>${pscore}/10</b><span>Original pattern items</span></div><div class="score-box"><b>${js}/6</b><span>Judgement principle matches</span></div><div class="score-box"><b>Not scored</b><span>Personality preferences</span></div></div><div class="question-card"><div class="question-label">Your selected descriptors</div><p class="result-text">${topWords.length?`You selected these as most natural across the practice sets: <b>${topWords.join(', ')}</b>. Least-natural selections: <b>${lowWords.join(', ')}</b>. These are your choices in this practice set only, not a scored personality profile.`:'No descriptor pattern available.'}</p></div><div class="question-card"><div class="question-label">Review your reasoning score</div><p class="result-text">${pscore>=8?'Strong practice result. Keep the same calm process: test one rule, verify it across all items, then choose.':pscore>=5?'Solid starting point. Review any missed explanation, especially whether a second pattern or a changing interval was involved.':'Use the explanations as a method check, not a verdict. Practise identifying one rule at a time and testing it against every item.'}</p><div class="divider"></div><p class="result-text">The official Plum format uses untimed questions. Do not rush the real assessment; read each forced-choice instruction carefully. For personality and preferences, answer honestly and consistently rather than trying to manufacture an ideal profile.</p></div><div class="start-row"><button class="btn" onclick="retake()">Restart practice</button><button class="btn secondary" onclick="window.print()">Print debrief</button></div><div class="disclaimer">Original practice content, independent of Citi and Plum. Personality choices are not scored; the reasoning and scenario feedback are training aids only.</div></div>`}
function retake(){state.started=false;state.submitted=false;state.section=0;state.q=0;state.answers={};persist();intro()}
function how(){alert('This is an independent practice simulator. It uses original questions across five public Plum Discovery Survey formats: forced-choice preferences, visual pattern reasoning, descriptors and workplace scenarios. Official Plum guidance says the survey is untimed and usually takes about 25 minutes. Your answers are stored only in this browser for practice; this simulator does not connect to Citi, Plum or any recruiter.');}
document.getElementById('helpBtn').addEventListener('click',how);intro();nav();updateProgress();
</script>
</body>
</html>
